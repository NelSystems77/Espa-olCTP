<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruta 100 · Español 10°</title>
<meta name="description" content="Práctica interactiva de 0 a 100 para el I examen de Español 10° (II periodo 2026): La casa de Asterión, La metamorfosis, el verbo y el texto crítico.">
<meta name="theme-color" content="#2F4F9A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232F4F9A'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='Georgia'%3E100%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS — psicología del color:
   azul = calma y concentración · ámbar/coral = creatividad (literatura)
   verde = logro y crecimiento · violeta = reto / evaluación
   ========================================================= */
:root{
  --bg:#F5F3EE; --bg-2:#ECE8DF;
  --surface:#FFFFFF; --surface-2:#F8F6F1; --surface-3:#EFEBE3;
  --text:#1E2433; --muted:#5A6275; --border:#DDD7CB;
  --primary:#2F4F9A; --primary-2:#3E66C2; --primary-soft:#E4EAF8; --on-primary:#FFFFFF;
  --lit:#C8612E; --lit-soft:#FBE9DD;
  --verb:#2D6FC4; --verb-soft:#E1ECFA;
  --write:#1A8663; --write-soft:#DDF3EA;
  --exam:#6A4FC4; --exam-soft:#ECE6FA;
  --ok:#17805D; --ok-soft:#DCF2E8;
  --ko:#C2473D; --ko-soft:#FBE4E1;
  --warn:#A86A0B; --warn-soft:#FCF0D6;
  --paper:#FFFBF2; --paper-ink:#3A2F22;
  --shadow:0 1px 2px rgba(30,36,51,.06), 0 6px 20px rgba(30,36,51,.07);
  --shadow-lg:0 10px 40px rgba(30,36,51,.12);
  --radius:18px; --radius-sm:12px;
  --blob-1:rgba(62,102,194,.20); --blob-2:rgba(200,97,46,.16); --blob-3:rgba(26,134,99,.14);
  --fs:17px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1522; --bg-2:#141B2B;
    --surface:#18202F; --surface-2:#1C2536; --surface-3:#242E42;
    --text:#E8ECF4; --muted:#A3ADC2; --border:#2E3950;
    --primary:#8FA9EE; --primary-2:#A9BDF3; --primary-soft:#22305020; --on-primary:#0F1522;
    --lit:#F0A071; --lit-soft:#3A2518;
    --verb:#7FB0F0; --verb-soft:#1B2C45;
    --write:#5FCFA5; --write-soft:#15332A;
    --exam:#B39DF5; --exam-soft:#2A2345;
    --ok:#5FCFA5; --ok-soft:#153328;
    --ko:#F08A80; --ko-soft:#3A1E1C;
    --warn:#F0C065; --warn-soft:#3A2E14;
    --paper:#1F2433; --paper-ink:#EDE3D1;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    --shadow-lg:0 10px 40px rgba(0,0,0,.4);
    --blob-1:rgba(95,130,230,.18); --blob-2:rgba(240,160,113,.10); --blob-3:rgba(95,207,165,.10);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1522; --bg-2:#141B2B;
  --surface:#18202F; --surface-2:#1C2536; --surface-3:#242E42;
  --text:#E8ECF4; --muted:#A3ADC2; --border:#2E3950;
  --primary:#8FA9EE; --primary-2:#A9BDF3; --primary-soft:#22305020; --on-primary:#0F1522;
  --lit:#F0A071; --lit-soft:#3A2518;
  --verb:#7FB0F0; --verb-soft:#1B2C45;
  --write:#5FCFA5; --write-soft:#15332A;
  --exam:#B39DF5; --exam-soft:#2A2345;
  --ok:#5FCFA5; --ok-soft:#153328;
  --ko:#F08A80; --ko-soft:#3A1E1C;
  --warn:#F0C065; --warn-soft:#3A2E14;
  --paper:#1F2433; --paper-ink:#EDE3D1;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  --shadow-lg:0 10px 40px rgba(0,0,0,.4);
  --blob-1:rgba(95,130,230,.18); --blob-2:rgba(240,160,113,.10); --blob-3:rgba(95,207,165,.10);
}
:root[data-fs="lg"]{ --fs:19.5px; }

*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size:var(--fs); line-height:1.6; overflow-x:hidden; min-height:100vh;
}
.bg-blobs{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.bg-blobs span{position:absolute; border-radius:50%; filter:blur(60px); animation:float 26s ease-in-out infinite alternate}
.bg-blobs span:nth-child(1){width:46vmax;height:46vmax;background:var(--blob-1);top:-18vmax;left:-12vmax}
.bg-blobs span:nth-child(2){width:38vmax;height:38vmax;background:var(--blob-2);top:30vh;right:-16vmax;animation-delay:-8s}
.bg-blobs span:nth-child(3){width:34vmax;height:34vmax;background:var(--blob-3);bottom:-16vmax;left:18vw;animation-delay:-16s}
@keyframes float{ from{transform:translate(0,0) scale(1)} to{transform:translate(4vmax,3vmax) scale(1.08)} }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important; scroll-behavior:auto!important}
}
h1,h2,h3{font-family:'Fraunces', Georgia, serif; line-height:1.2; margin:0 0 .5em; letter-spacing:-.01em}
h1{font-size:clamp(1.8rem, 5vw, 2.6rem)}
h2{font-size:clamp(1.35rem, 3.6vw, 1.75rem)}
h3{font-size:1.15rem}
p{margin:0 0 .8em}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--primary-2); outline-offset:2px; border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.skip{position:absolute; left:-999px; top:8px; background:var(--primary); color:var(--on-primary); padding:8px 14px; border-radius:8px; z-index:100}
.skip:focus{left:8px}

/* ---------- Header ---------- */
.topbar{position:sticky; top:0; z-index:20; backdrop-filter:saturate(1.4) blur(12px); -webkit-backdrop-filter:saturate(1.4) blur(12px);
  background:color-mix(in srgb, var(--bg) 78%, transparent); border-bottom:1px solid var(--border)}
.topbar .in{max-width:1080px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); font-weight:700; margin-right:auto; min-width:0}
.brand .logo{width:36px; height:36px; border-radius:11px; background:linear-gradient(135deg,var(--primary),var(--exam)); color:#fff;
  display:grid; place-items:center; font-family:'Fraunces',serif; font-size:.8rem; flex:none; box-shadow:var(--shadow)}
.brand small{display:block; color:var(--muted); font-weight:400; font-size:.78rem; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand b{display:block; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
@media (max-width:520px){ .brand small{display:none} .pchip > span:first-child{display:none} .pchip{padding:5px 8px; font-size:.82rem} .topbar .in{gap:8px} .brand .logo{width:32px;height:32px} }
.pchip{display:flex; align-items:center; gap:6px; font-weight:700; font-size:.9rem; padding:6px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--border)}
.iconbtn{width:40px; height:40px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; display:grid; place-items:center; font-size:1rem; flex:none}
.iconbtn:hover{background:var(--surface-2)}

/* ---------- Layout ---------- */
main{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:20px 16px 90px}
.crumbs{font-size:.9rem; color:var(--muted); margin-bottom:12px; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.crumbs a{color:var(--muted)}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px}
.card + .card{margin-top:16px}
.stack > * + *{margin-top:16px}
.grid{display:grid; gap:16px}
@media (min-width:720px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} }
@media (min-width:560px) and (max-width:719px){ .g3{grid-template-columns:1fr 1fr} }
.muted{color:var(--muted)}
.small{font-size:.9rem}
.center{text-align:center}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.spacer{flex:1}
hr.soft{border:0; border-top:1px solid var(--border); margin:18px 0}

/* ---------- Buttons ---------- */
.btn{appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--text); font:inherit; font-weight:700;
  padding:11px 18px; border-radius:12px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; min-height:46px; transition:transform .12s, box-shadow .12s, background .12s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary); border-color:var(--primary); color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-2)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.btn.sm{min-height:38px; padding:7px 12px; font-size:.9rem}

/* ---------- Hero ---------- */
.hero{display:grid; gap:22px; align-items:center; padding:28px}
@media (min-width:760px){ .hero{grid-template-columns:1.4fr 1fr} }
.hero .kicker{display:inline-block; font-size:.82rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--primary); background:var(--primary-soft); padding:4px 10px; border-radius:999px; margin-bottom:10px}
.ringwrap{display:grid; place-items:center; position:relative}
.ringwrap svg{width:min(220px, 60vw); height:auto; transform:rotate(-90deg)}
.ringwrap .val{position:absolute; inset:0; display:grid; place-items:center; text-align:center}
.ringwrap .val b{font-family:'Fraunces',serif; font-size:3rem; line-height:1}
.ringwrap .val span{display:block; color:var(--muted); font-size:.85rem}
.ring-bg{stroke:var(--surface-3)}
.ring-fg{stroke:url(#ringgrad); transition:stroke-dashoffset 1s ease}

/* ---------- Module cards ---------- */
.mod{position:relative; overflow:hidden; display:flex; flex-direction:column; gap:10px; text-decoration:none; color:var(--text); transition:transform .15s, box-shadow .15s}
.mod:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg)}
.mod::before{content:""; position:absolute; inset:0 0 auto 0; height:5px; background:var(--accent)}
.mod .ic{width:46px; height:46px; border-radius:14px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-size:1.4rem}
.mod h3{margin:0}
.mod p{margin:0; color:var(--muted); font-size:.95rem}
.mod .meta{display:flex; align-items:center; gap:10px; margin-top:auto; font-size:.85rem; color:var(--muted)}
.bar{height:8px; border-radius:99px; background:var(--surface-3); overflow:hidden; flex:1}
.bar i{display:block; height:100%; background:var(--accent, var(--primary)); border-radius:99px; transition:width .6s}
.t-lit{--accent:var(--lit); --accent-soft:var(--lit-soft)}
.t-verb{--accent:var(--verb); --accent-soft:var(--verb-soft)}
.t-write{--accent:var(--write); --accent-soft:var(--write-soft)}
.t-exam{--accent:var(--exam); --accent-soft:var(--exam-soft)}
.step-label{font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent)}

/* ---------- Tabs ---------- */
.tabs{display:flex; gap:6px; background:var(--surface-3); padding:5px; border-radius:14px; margin:6px 0 18px; overflow-x:auto}
.tabs a{flex:1; text-align:center; padding:9px 14px; border-radius:10px; text-decoration:none; color:var(--muted); font-weight:700; white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--surface); color:var(--text); box-shadow:var(--shadow)}

/* ---------- Lesson content ---------- */
.lesson h2{margin-top:6px}
.lesson h3{margin-top:18px; color:var(--accent, var(--primary))}
.lesson ul,.lesson ol{padding-left:1.25em; margin:0 0 .8em}
.lesson li{margin:.25em 0}
.callout{border-left:5px solid var(--accent, var(--primary)); background:var(--accent-soft, var(--primary-soft)); padding:14px 16px; border-radius:0 12px 12px 0; margin:14px 0}
.callout.warn{--accent:var(--warn); --accent-soft:var(--warn-soft)}
.callout.ok{--accent:var(--ok); --accent-soft:var(--ok-soft)}
.callout > :last-child{margin-bottom:0}
.frag{background:var(--paper); color:var(--paper-ink); font-family:'Fraunces', Georgia, serif; font-size:1.05em; line-height:1.7; padding:16px 18px; border-radius:12px; border:1px solid var(--border); margin:10px 0 14px; position:relative}
.frag::before{content:"❝"; position:absolute; top:-10px; left:12px; font-size:1.6rem; color:var(--accent, var(--lit)); background:var(--surface); line-height:1; padding:0 4px; border-radius:6px}
details.acc{border:1px solid var(--border); border-radius:12px; background:var(--surface-2); margin:10px 0}
details.acc summary{cursor:pointer; padding:12px 16px; font-weight:700; list-style:none; display:flex; align-items:center; gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"＋"; margin-left:auto; color:var(--muted)}
details.acc[open] summary::after{content:"－"}
details.acc > div{padding:0 16px 14px}
.tbl-wrap{overflow-x:auto; margin:10px 0 16px; border-radius:12px; border:1px solid var(--border)}
table{border-collapse:collapse; width:100%; font-size:.95rem; background:var(--surface)}
th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--border); vertical-align:top}
th{background:var(--surface-3); font-weight:700}
tr:last-child td{border-bottom:0}
.pill{display:inline-block; padding:2px 10px; border-radius:99px; font-size:.8rem; font-weight:700; background:var(--accent-soft, var(--primary-soft)); color:var(--accent, var(--primary))}
.timeline{list-style:none; padding:0!important; margin:10px 0; border-left:3px solid var(--accent-soft, var(--border))}
.timeline li{position:relative; padding:4px 0 10px 18px!important}
.timeline li::before{content:""; position:absolute; left:-8px; top:10px; width:13px; height:13px; border-radius:50%; background:var(--accent, var(--primary)); border:3px solid var(--surface)}
.timeline b{color:var(--accent, var(--primary))}
.struct{display:flex; flex-wrap:wrap; gap:4px; font-family:'Fraunces',serif; font-size:1.5rem; margin:10px 0}
.struct span{padding:4px 10px; border-radius:10px}
.struct .r{background:var(--verb-soft); color:var(--verb)}
.struct .v{background:var(--warn-soft); color:var(--warn)}
.struct .d{background:var(--write-soft); color:var(--write)}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:.85rem}
.legend i{display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:4px}
.irr{background:var(--lit-soft); color:var(--lit); font-weight:700; border-radius:5px; padding:0 3px}

/* ---------- Quiz ---------- */
.qhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.lvl{font-size:.78rem; font-weight:700; padding:4px 10px; border-radius:99px}
.lvl-1{background:var(--verb-soft); color:var(--verb)}
.lvl-2{background:var(--lit-soft); color:var(--lit)}
.lvl-3{background:var(--exam-soft); color:var(--exam)}
.qprog{display:flex; align-items:center; gap:10px; margin-bottom:14px; font-size:.9rem; color:var(--muted)}
.qtext{font-size:1.12em; font-weight:700; margin-bottom:12px}
.opts{display:grid; gap:10px; margin:0; padding:0; list-style:none}
.opt{width:100%; text-align:left; display:flex; gap:12px; align-items:flex-start; padding:13px 14px; border-radius:14px; border:2px solid var(--border); background:var(--surface-2); color:var(--text); font:inherit; cursor:pointer; transition:border-color .12s, background .12s, transform .12s}
.opt:hover:not([disabled]){border-color:var(--primary-2); background:var(--surface)}
.opt .k{flex:none; width:28px; height:28px; border-radius:8px; display:grid; place-items:center; background:var(--surface-3); font-weight:700; font-size:.85rem}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok); background:var(--ok-soft)}
.opt.correct .k{background:var(--ok); color:#fff}
.opt.wrong{border-color:var(--ko); background:var(--ko-soft)}
.opt.wrong .k{background:var(--ko); color:#fff}
.opt.dim{opacity:.6}
.fb{margin-top:14px; border-radius:14px; padding:14px 16px; border:1px solid var(--border); animation:pop .25s ease}
.fb.ok{background:var(--ok-soft); border-color:color-mix(in srgb, var(--ok) 40%, transparent)}
.fb.ko{background:var(--ko-soft); border-color:color-mix(in srgb, var(--ko) 40%, transparent)}
.fb.almost{background:var(--warn-soft); border-color:color-mix(in srgb, var(--warn) 40%, transparent)}
.fb h4{margin:0 0 6px; font-size:1rem}
.fb p:last-child{margin-bottom:0}
@keyframes pop{from{transform:scale(.98); opacity:0} to{transform:none; opacity:1}}
.inrow{display:flex; gap:8px; flex-wrap:wrap}
.inrow input{flex:1; min-width:180px}
input[type=text], textarea, select{font:inherit; color:var(--text); background:var(--surface-2); border:2px solid var(--border); border-radius:12px; padding:11px 13px; width:100%}
input[type=text]:focus, textarea:focus, select:focus{border-color:var(--primary-2); outline:none; box-shadow:0 0 0 4px color-mix(in srgb, var(--primary-2) 25%, transparent)}
textarea{resize:vertical; min-height:120px; line-height:1.6}
.accents{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.accents button{min-width:40px; min-height:38px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font:inherit; font-weight:700; cursor:pointer}
.tapfrag{line-height:2.3; background:var(--paper); color:var(--paper-ink); padding:14px; border-radius:12px; border:1px solid var(--border); font-family:'Fraunces',Georgia,serif; font-size:1.05em}
.tok{font:inherit; color:inherit; background:transparent; border:2px solid transparent; border-radius:8px; padding:1px 4px; margin:0 1px; cursor:pointer}
.tok:hover{background:var(--surface-3)}
.tok[aria-pressed="true"]{background:var(--primary-soft); border-color:var(--primary-2)}
.tok.t-ok{background:var(--ok-soft); border-color:var(--ok)}
.tok.t-ko{background:var(--ko-soft); border-color:var(--ko); text-decoration:line-through}
.tok.t-miss{border-color:var(--ok); border-style:dashed}
.tok[disabled]{cursor:default}
.score-big{font-family:'Fraunces',serif; font-size:3.4rem; line-height:1}
.lvlstats{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin:16px 0}
.lvlstats > div{background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:12px}
.review-item{border:1px solid var(--border); border-radius:12px; padding:12px 14px; background:var(--surface-2); margin:8px 0}
.kbd-hint{font-size:.8rem; color:var(--muted); margin-top:10px}
.badge{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:99px; font-weight:700; font-size:.88rem}
.badge.ini{background:var(--ko-soft); color:var(--ko)}
.badge.int{background:var(--warn-soft); color:var(--warn)}
.badge.ava{background:var(--ok-soft); color:var(--ok)}

/* ---------- Temario / cobertura ---------- */
.cov td:first-child{width:38%}
.cov .ok{color:var(--ok); font-weight:700}
.cov a{font-size:.88rem}
.ind-h{display:flex; gap:10px; align-items:baseline}
.ind-h .n{font-family:'Fraunces',serif; font-size:1.6rem; color:var(--accent)}

/* ---------- Taller ---------- */
.stepper{display:flex; gap:6px; overflow-x:auto; margin:0 0 16px; padding-bottom:4px}
.stepper button{flex:1; min-width:110px; border:1px solid var(--border); background:var(--surface); color:var(--muted); border-radius:12px; padding:9px 10px; font:inherit; font-weight:700; font-size:.88rem; cursor:pointer}
.stepper button[aria-current="step"]{background:var(--write); border-color:var(--write); color:#fff}
.topic{cursor:pointer; text-align:left; font:inherit; color:var(--text); border:2px solid var(--border); background:var(--surface-2); border-radius:14px; padding:14px; display:block; width:100%}
.topic:hover{border-color:var(--write)}
.topic[aria-pressed="true"]{border-color:var(--write); background:var(--write-soft)}
.topic b{display:block; margin-bottom:4px}
.wc{display:flex; justify-content:space-between; font-size:.85rem; color:var(--muted); margin-top:4px}
.checks{list-style:none; padding:0; margin:0}
.checks li{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border)}
.checks li:last-child{border-bottom:0}
.checks .st{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:.85rem; font-weight:700}
.st.ok{background:var(--ok-soft); color:var(--ok)}

LESSONS.fases = `
<h2>¿Cómo se analiza un texto literario?</h2>
<p>El MEP propone analizar la obra en <b>cuatro fases</b>. Piénsalas como una escalera: primero lees y sientes, luego ubicas, después desarmas y al final interpretas.</p>
<div class="tbl-wrap"><table>
<tr><th>Fase</th><th>¿Qué haces?</th><th>Ejemplo con los textos</th></tr>
<tr><td><b>1. Natural</b> (vivencial)</td><td>Lectura completa, primeras impresiones, vocabulario desconocido, resumen breve del argumento.</td><td>«Me sorprendió que el narrador fuera el Minotauro.»</td></tr>
<tr><td><b>2. De ubicación</b></td><td>Datos del autor, época, país, movimiento literario, género, obra a la que pertenece, contexto histórico-social.</td><td>«Kafka publicó <i>La metamorfosis</i> en 1915, en Praga, parte del Imperio austrohúngaro.»</td></tr>
<tr><td><b>3. Analítica</b></td><td>Desarmar el texto: tema central y secundarios, personajes, narrador, espacios, tiempo, estructura, recursos.</td><td>«El espacio psicológico de Gregor es de angustia y culpa.»</td></tr>
<tr><td><b>4. Explicativa e interpretativa</b></td><td>Interpretar símbolos, explicar el mensaje, relacionarlo con la realidad actual y valorarlo críticamente; enseñanzas.</td><td>«Hoy también se valora a las personas solo por lo que producen.»</td></tr>
</table></div>
<div class="callout"><b>Truco de memoria:</b> <b>N</b>o <b>U</b>ses <b>A</b>tajos, <b>I</b>nterpreta → <b>N</b>atural · <b>U</b>bicación · <b>A</b>nalítica · <b>I</b>nterpretativa.</div>

<h3>Elementos de análisis (fase analítica)</h3>
<ul>
<li><b>Tema central:</b> la idea principal. Es <b>implícito</b> cuando no se dice directamente y hay que deducirlo.</li>
<li><b>Temas secundarios:</b> ideas que acompañan y enriquecen al tema central.</li>
<li><b>Personajes:</b> principales (protagonista, antagonista), secundarios e incidentales o mencionados.</li>
<li><b>Narrador:</b> protagonista (1.ª persona), testigo, omnisciente (3.ª persona, lo sabe todo).</li>
<li><b>Tiempo y estructura:</b> orden de los hechos, partes del texto, introducción–nudo–desenlace.</li>
<li><b>Espacios literarios:</b> ver tabla abajo.</li>
<li><b>Enseñanza:</b> lección o reflexión que deja el texto.</li>
</ul>

<h3>Los cinco espacios literarios</h3>
<div class="tbl-wrap"><table>
<tr><th>Espacio</th><th>Pregunta guía</th></tr>
<tr><td><b>Físico</b></td><td>¿Dónde ocurren los hechos? Lugares concretos: casa, cuarto, ciudad, laberinto.</td></tr>
<tr><td><b>Psicológico</b></td><td>¿Qué sienten y piensan los personajes? Emociones, miedos, soledad, angustia.</td></tr>
<tr><td><b>Económico</b></td><td>¿Cuál es su situación material? Dinero, trabajo, deudas, clase social, lujos o pobreza.</td></tr>
<tr><td><b>Moral</b></td><td>¿Qué valores o antivalores aparecen? Juicios sobre el bien y el mal, conductas éticas.</td></tr>
<tr><td><b>Religioso</b></td><td>¿Qué creencias, ritos o referencias a lo sagrado aparecen? Dios, sacrificio, redención.</td></tr>
</table></div>

<h3>Cuento vs. novela</h3>
<div class="grid g2">
<div class="callout"><b>Cuento</b><ul><li>Narración <b>breve</b>.</li><li><b>Un solo conflicto</b> o hecho central.</li><li><b>Pocos personajes</b>, poco desarrollados.</li><li><b>Unidad de efecto</b>: todo apunta a una sola impresión.</li><li>Lenguaje concentrado; a menudo <b>final sorpresivo</b>.</li><li>Se lee de una sola vez.</li></ul></div>
<div class="callout"><b>Novela</b><ul><li>Narración <b>extensa</b> (la novela corta o <i>nouvelle</i> es intermedia).</li><li><b>Varios conflictos</b> y acontecimientos.</li><li><b>Varios personajes</b> que evolucionan.</li><li>Desarrollo <b>psicológico</b> profundo.</li><li>Dividida en <b>capítulos o partes</b>.</li><li>Varios espacios y un tiempo más amplio.</li></ul></div>
</div>

<h3>Realismo social</h3>
<p>Corriente que busca <b>reflejar la realidad</b> de la sociedad para <b>denunciar</b> sus problemas y provocar reflexión.</p>
<ul>
<li><b>Denuncia social:</b> injusticia, pobreza, explotación laboral, exclusión.</li>
<li><b>Personajes comunes</b> (trabajadores, marginados), no héroes idealizados.</li>
<li><b>Crítica</b> a instituciones: familia, trabajo, poder, burocracia.</li>
<li>Muestra la <b>deshumanización</b> y la <b>alienación</b> del individuo.</li>
<li>Lenguaje claro; <b>compromiso</b> del escritor con su época.</li>
</ul>
<div class="tbl-wrap"><table>
<tr><th>Rasgo</th><th>La metamorfosis</th><th>La casa de Asterión</th></tr>
<tr><td>Denuncia</td><td>Explotación laboral; la persona vale por lo que produce.</td><td>Marginación y encierro del que es diferente.</td></tr>
<tr><td>Personaje común / marginado</td><td>Gregor, un viajante de comercio endeudado.</td><td>Asterión, temido y aislado por la «plebe».</td></tr>
<tr><td>Crítica a instituciones</td><td>La empresa (el apoderado) y la familia interesada.</td><td>El poder (tributo de Atenas a Creta; sacrificio de víctimas).</td></tr>
<tr><td>Deshumanización</td><td>Gregor pasa a ser «eso», un bicho estorboso.</td><td>El «monstruo» tiene sentimientos, pero nadie lo ve como humano.</td></tr>
</table></div>
<div class="callout warn"><b>Ojo:</b> Kafka suele asociarse también al expresionismo y a la literatura del absurdo, y Borges a la literatura fantástica. Pero en el examen se te pide leerlos desde el <b>Realismo social</b>: busca la <b>crítica a la sociedad</b> que hay detrás de lo fantástico.</div>
`;

LESSONS.asterion = `
<h2>La casa de Asterión — Jorge Luis Borges</h2>
<p><span class="pill">Cuento</span> <span class="pill">Publicado en 1947</span> <span class="pill">Incluido en <i>El Aleph</i> (1949)</span> <span class="pill">Narrador protagonista, 1.ª persona</span></p>

<h3>1 · Fase natural: ¿de qué trata?</h3>
<p>El cuento abre con un epígrafe de Apolodoro: la reina dio a luz un hijo llamado Asterión. Luego, <b>Asterión habla en primera persona</b> y se defiende de lo que dicen de él: lo acusan de soberbia, misantropía y locura. Afirma que <b>no es prisionero</b> (las puertas de su casa están abiertas y «cuyo número es infinito»), que es <b>único</b> y que la casa es del tamaño del mundo.</p>
<p>Cuenta que una vez salió a la calle y la gente (la «plebe») huyó aterrada. Para pasar el tiempo corre por las galerías, se esconde y juega con un <b>«otro Asterión»</b> imaginario. Dice que <b>cada nueve años entran nueve hombres</b> a la casa «para que yo los libere de todo mal»: los mata sin ensuciarse las manos. Uno de ellos profetizó que vendría su <b>redentor</b>, y Asterión lo espera con ilusión, deseando que lo lleve a un lugar con menos galerías y menos puertas.</p>
<p><b>Final sorpresivo:</b> la voz cambia y Teseo le dice a Ariadna que el minotauro <b>apenas se defendió</b>. Así descubrimos que el narrador era el Minotauro y que aceptó la muerte como liberación.</p>

<h3>2 · El mito de Teseo y el Minotauro</h3>
<ol class="timeline">
<li><b>Minos</b>, rey de Creta, pide a Poseidón un toro blanco y promete sacrificarlo, pero no cumple.</li>
<li>Como castigo, <b>Pasífae</b> (esposa de Minos) se enamora del toro y nace el <b>Minotauro</b> (mitad hombre, mitad toro), cuyo nombre era Asterión («el estrellado»).</li>
<li><b>Dédalo</b> construye el <b>laberinto</b> para encerrarlo.</li>
<li>Atenas debe enviar un <b>tributo</b> de jóvenes (7 muchachos y 7 doncellas) para alimentar al Minotauro.</li>
<li><b>Teseo</b>, hijo del rey Egeo, se ofrece a ir. <b>Ariadna</b>, hija de Minos, se enamora de él y le da un <b>ovillo de hilo</b> para salir del laberinto.</li>
<li>Teseo mata al Minotauro y sale siguiendo el hilo. Después abandona a Ariadna en Naxos y, al olvidar cambiar las velas negras por blancas, su padre Egeo se lanza al mar (mar Egeo).</li>
</ol>
<div class="callout"><b>¿Qué cambia Borges?</b> <ul><li>Cuenta la historia <b>desde el monstruo</b>: le da voz, pensamientos y sentimientos → lo <b>humaniza</b>.</li><li>Convierte al héroe en el «redentor» esperado.</li><li>En lugar de 7 + 7 jóvenes, habla de <b>nueve hombres cada nueve años</b>.</li><li>El Minotauro <b>no lucha</b>: desea la muerte.</li></ul></div>

<h3>3 · Fase de ubicación: Jorge Luis Borges</h3>
<ol class="timeline">
<li><b>1899</b> — Nace el 24 de agosto en <b>Buenos Aires, Argentina</b>. Crece en una casa con gran biblioteca inglesa; es bilingüe.</li>
<li><b>1914–1921</b> — Vive en Ginebra y España; participa en el <b>ultraísmo</b> (vanguardia).</li>
<li><b>1937–1946</b> — Trabaja en una biblioteca municipal. En 1946, el gobierno de Perón lo «asciende» a inspector de aves en un mercado, humillación que lo lleva a renunciar.</li>
<li><b>1944 / 1949</b> — Publica <i>Ficciones</i> y <i>El Aleph</i> (donde está «La casa de Asterión»).</li>
<li><b>1955</b> — Es nombrado director de la <b>Biblioteca Nacional</b>, cuando ya estaba casi <b>ciego</b> (ceguera progresiva hereditaria).</li>
<li><b>1979</b> — Recibe el <b>Premio Cervantes</b>. Nunca obtuvo el Nobel.</li>
<li><b>1986</b> — Muere el 14 de junio en <b>Ginebra, Suiza</b>.</li>
</ol>
<div class="callout"><b>Relación autor ↔ texto</b><ul>
<li>Sus temas favoritos: <b>laberintos, el infinito, espejos, el doble, el tiempo, la identidad</b> → todos aparecen en el cuento (la casa infinita, «el otro Asterión»).</li>
<li>Su amor por los <b>mitos clásicos</b> y la erudición (epígrafe de Apolodoro).</li>
<li>La <b>soledad</b> y el encierro: el hombre de biblioteca, luego ciego, que vive en un mundo interior; y el aislamiento que sintió hacia 1946-47.</li>
</ul></div>

<h3>4 · Fase analítica</h3>
<p><b>Tema central (implícito):</b> la <b>soledad</b> y el <b>aislamiento</b> del ser diferente, marginado por la sociedad, que termina viendo en la <b>muerte una liberación</b> (redención).</p>
<p><b>Temas secundarios:</b> la identidad y la otredad (¿quién es el verdadero monstruo?) · el laberinto como símbolo del mundo y del infinito · la soberbia y el orgullo · la espera de un redentor · el miedo a lo diferente · la relatividad de la verdad (cada quien cuenta su versión).</p>
<div class="tbl-wrap"><table>
<tr><th>Personaje</th><th>Rasgos</th></tr>
<tr><td><b>Asterión</b> (el Minotauro)</td><td>Protagonista y narrador. Solitario, orgulloso, ingenuo, se cree único; hijo de una reina; no sabe leer («las minucias» no le interesan).</td></tr>
<tr><td><b>Teseo</b></td><td>Héroe que mata a Asterión; aparece solo al final. Para Asterión es el «redentor».</td></tr>
<tr><td><b>Ariadna</b></td><td>Mencionada al final; Teseo le habla.</td></tr>
<tr><td><b>Los nueve hombres</b></td><td>Víctimas que entran cada nueve años; uno profetiza la llegada del redentor.</td></tr>
<tr><td><b>La plebe / la gente</b></td><td>Personaje colectivo que huye con miedo cuando Asterión sale.</td></tr>
<tr><td><b>La reina</b> (madre)</td><td>Mencionada: «hijo de reina». Referencia a Pasífae.</td></tr>
</table></div>
<h3>Espacios</h3>
<details class="acc" open><summary>🏛️ Físico</summary><div>La <b>casa-laberinto</b>: galerías, patios, aljibes, pesebres y abrevaderos que se repiten («son catorce [son infinitos]»); también la calle a la que sale una vez, y el templo y el mar que menciona. Sin muebles ni lujos.</div></details>
<details class="acc"><summary>🧠 Psicológico</summary><div>Soledad profunda, aburrimiento, ansiedad y esperanza. Inventa al «otro Asterión» para tener compañía. Se siente incomprendido y orgulloso a la vez.</div></details>
<details class="acc"><summary>💰 Económico</summary><div><b>Austeridad</b>: la casa no tiene «pompas mujeriles» ni «el bizarro aparato de los palacios». Además, los nueve hombres remiten al <b>tributo</b> que Atenas pagaba a Creta: una relación de poder y dominio.</div></details>
<details class="acc"><summary>⚖️ Moral</summary><div>Asterión <b>justifica</b> la muerte de los hombres como una forma de «liberarlos de todo mal». El texto invierte los valores: ¿es monstruo quien mata o quien lo encierra y lo teme? También aparece la <b>soberbia</b> («no en vano fue una reina mi madre»).</div></details>
<details class="acc"><summary>🙏 Religioso</summary><div>La espera de un <b>redentor</b> (idea de salvación), el <b>sacrificio ritual</b> de víctimas, el epígrafe mitológico y la sugerencia de que Asterión pudo haber creado «las estrellas y el sol».</div></details>

<h3>5 · Fase explicativa e interpretativa</h3>
<ul>
<li>El <b>laberinto</b> simboliza el mundo, la soledad y la mente del ser humano moderno, perdido y sin salida.</li>
<li>El <b>número catorce</b> significa «infinito» en el cuento.</li>
<li>El narrador es <b>poco confiable</b>: dice que no es prisionero, pero no sale; se cree superior, pero sufre. Esa <b>ironía</b> nos obliga a leer entre líneas.</li>
<li>El final («apenas se defendió») revela que Asterión <b>deseaba morir</b>: la muerte como redención.</li>
<li><b>Relación con el contexto:</b> posguerra y angustia existencial; el ser humano encerrado en sí mismo. También puede leerse junto al aislamiento que vivió Borges en esos años.</li>
</ul>
<div class="callout ok"><b>Enseñanzas</b><ul><li>No juzgar a las personas por su apariencia ni por lo que otros dicen de ellas.</li><li>La marginación y el rechazo pueden destruir a una persona; la soledad duele.</li><li>Toda historia tiene otra versión: ponerse en el lugar del otro (empatía).</li></ul></div>

<h3>Características del cuento presentes</h3>
<ul>
<li><b>Brevedad:</b> se lee en pocos minutos.</li>
<li><b>Un solo hecho central:</b> la vida solitaria de Asterión y su espera.</li>
<li><b>Pocos personajes:</b> uno principal; Teseo y Ariadna apenas aparecen.</li>
<li><b>Unidad de efecto</b> e intensidad: todo prepara el impacto del final.</li>
<li><b>Final sorpresivo</b> que cambia la lectura de todo el texto.</li>
<li><b>Economía de lenguaje:</b> cada detalle (catorce, el otro Asterión, el redentor) tiene sentido.</li>
</ul>
`;

LESSONS.metamorfosis = `
<h2>La metamorfosis — Franz Kafka</h2>
<p><span class="pill">Novela (corta)</span> <span class="pill">Publicada en 1915</span> <span class="pill">Título original: <i>Die Verwandlung</i></span> <span class="pill">Narrador omnisciente, 3.ª persona</span></p>

<h3>1 · Fase natural: resumen por partes</h3>
<details class="acc" open><summary>Parte I — La transformación</summary><div>
<p>Una mañana, <b>Gregor Samsa</b>, <b>viajante de comercio</b> (vendedor de telas), despierta convertido en un <b>monstruoso insecto</b>. Lo que más le preocupa es haber perdido el tren y llegar tarde al trabajo. Llega el <b>apoderado</b> (gerente) de la empresa a reclamar su ausencia. Cuando Gregor abre la puerta, el apoderado huye espantado, la madre se desmaya y el <b>padre</b> lo obliga a volver a su cuarto con un bastón; Gregor queda herido.</p></div></details>
<details class="acc"><summary>Parte II — El encierro</summary><div>
<p>Su hermana <b>Grete</b> se encarga de alimentarlo: descubre que ya no le gusta la leche y prefiere comida podrida. Gregor escucha desde su cuarto la situación económica: el negocio del padre quebró, hay una <b>deuda con el jefe</b> de Gregor, y él era el <b>único sostén</b> (aunque el padre tenía ahorros ocultos). Gregor soñaba con enviar a Grete al <b>conservatorio</b> a estudiar violín. Grete y la madre sacan los muebles; Gregor se aferra al <b>cuadro de la dama con pieles</b>. La madre se desmaya al verlo. El padre, ahora con <b>uniforme</b> de ordenanza de banco, le lanza <b>manzanas</b>; una se le incrusta en la espalda y se pudre.</p></div></details>
<details class="acc"><summary>Parte III — El rechazo y la muerte</summary><div>
<p>La familia trabaja: el padre en un banco, la madre cose ropa, Grete es dependienta. Alquilan una habitación a <b>tres huéspedes</b>. Una <b>asistenta</b> anciana lo llama «bicho». Una noche Grete toca el violín para los huéspedes; Gregor, atraído por la música, sale y los huéspedes lo ven y se niegan a pagar. Grete dice que hay que «librarse de <b>eso</b>»: ya no lo considera su hermano. Esa madrugada <b>Gregor muere</b> pensando con cariño en su familia. La asistenta lo encuentra. El padre dice que pueden «dar gracias a Dios» y se santiguan; echan a los huéspedes y los tres salen en <b>tranvía al campo</b>, aliviados, pensando en buscarle un buen marido a Grete.</p></div></details>

<h3>2 · Fase de ubicación: Franz Kafka</h3>
<ol class="timeline">
<li><b>1883</b> — Nace el 3 de julio en <b>Praga</b> (entonces Imperio austrohúngaro), en una familia <b>judía de lengua alemana</b>.</li>
<li><b>Padre autoritario</b> (Hermann Kafka), comerciante exigente que lo hacía sentir débil e inútil.</li>
<li><b>1906</b> — Se doctora en Derecho. Trabaja en el <b>Instituto de Seguros de Accidentes de Trabajo</b>: un empleo burocrático que detestaba; escribía de noche.</li>
<li><b>1915</b> — Publica <i>La metamorfosis</i>.</li>
<li><b>1919</b> — Escribe <i>Carta al padre</i>, donde expresa el miedo y la culpa que su padre le provocaba.</li>
<li><b>1924</b> — Muere de <b>tuberculosis</b> el 3 de junio cerca de Viena. Pidió a su amigo <b>Max Brod</b> que quemara sus escritos; Brod no lo hizo y publicó <i>El proceso</i> y <i>El castillo</i>.</li>
</ol>
<div class="callout"><b>Relación autor ↔ texto</b><ul>
<li><b>Padre autoritario</b> ↔ el señor Samsa, que agrede a Gregor.</li>
<li><b>Trabajo burocrático y agobiante</b> ↔ la vida de viajante que Gregor odia.</li>
<li>Sentimientos de <b>culpa, inutilidad y aislamiento</b> ↔ Gregor se siente una carga.</li>
<li>La <b>enfermedad</b>: Kafka también se sintió una carga (tuberculosis).</li>
<li>De su obra surge el adjetivo <b>«kafkiano»</b>: situación absurda, angustiosa y sin salida.</li>
</ul></div>

<h3>3 · Fase analítica</h3>
<p><b>Tema principal:</b> la <b>alienación y deshumanización</b> del individuo en la sociedad moderna: la persona vale solo mientras <b>produce</b>; cuando deja de ser útil, es rechazada.</p>
<p><b>Temas secundarios:</b> la soledad e incomunicación · las relaciones familiares por interés (hipocresía) · la autoridad paterna · la culpa · el trabajo opresivo · la pérdida de identidad · el sacrificio no reconocido · la enfermedad y la discapacidad.</p>
<div class="tbl-wrap"><table>
<tr><th>Personaje</th><th>Rasgos y evolución</th></tr>
<tr><td><b>Gregor Samsa</b></td><td>Protagonista. Responsable, sacrificado, sumiso; sostén económico de la familia. Transformado en insecto, se aísla y muere.</td></tr>
<tr><td><b>Grete</b> (hermana)</td><td>17 años, toca el violín. Al inicio lo cuida con compasión; al final propone «librarse de eso». Termina convertida en una joven que «florece».</td></tr>
<tr><td><b>El padre</b> (señor Samsa)</td><td>Autoritario y violento; parecía débil y sin trabajo, pero luego se reactiva con uniforme. Le lanza manzanas.</td></tr>
<tr><td><b>La madre</b></td><td>Débil, asmática, se desmaya; ama a Gregor pero no lo defiende.</td></tr>
<tr><td><b>El apoderado</b></td><td>Representa a la empresa: frío, exigente, desconfiado.</td></tr>
<tr><td><b>Tres huéspedes</b></td><td>Inquilinos con barba; representan la mirada social que juzga.</td></tr>
<tr><td><b>La asistenta</b></td><td>Anciana que limpia; no le tiene miedo, lo llama «bicho» y encuentra su cadáver.</td></tr>
</table></div>
<h3>Espacios</h3>
<details class="acc" open><summary>🏠 Físico</summary><div>El <b>apartamento</b> familiar en una ciudad, especialmente el <b>cuarto de Gregor</b> (cada vez más sucio y lleno de trastos); la ventana desde la que ve el hospital; la sala. Al final, el <b>campo</b> al que viaja la familia en tranvía.</div></details>
<details class="acc"><summary>🧠 Psicológico</summary><div>Gregor: angustia, culpa, soledad, deseo de seguir siendo útil, pérdida de identidad. La familia pasa de la <b>compasión</b> al <b>asco</b>, la vergüenza y el <b>alivio</b> tras su muerte.</div></details>
<details class="acc"><summary>💰 Económico</summary><div>Deuda del padre con el jefe; Gregor es el <b>único sostén</b>. Tras la transformación, todos deben trabajar y alquilan una habitación a huéspedes. El valor de Gregor dependía del dinero que llevaba.</div></details>
<details class="acc"><summary>⚖️ Moral</summary><div>El <b>egoísmo e hipocresía</b> familiar frente al <b>sacrificio</b> de Gregor; el deber contra la libertad personal; la ingratitud; la violencia del padre.</div></details>
<details class="acc"><summary>🙏 Religioso</summary><div>Tras la muerte, el padre dice que pueden «dar gracias a Dios» y los tres <b>se santiguan</b> (ironía: agradecen la muerte de un hijo). La <b>manzana</b> puede leerse como símbolo del pecado y la culpa; Gregor como <b>víctima sacrificial</b> que muere para que la familia «renazca».</div></details>

<h3>4 · Fase explicativa e interpretativa</h3>
<ul>
<li>La transformación <b>hace visible</b> lo que Gregor ya era: un ser deshumanizado, reducido a su trabajo («ya vivía como un insecto»).</li>
<li>Al sacar los muebles, Gregor se aferra al cuadro: defiende sus <b>recuerdos y su humanidad</b>.</li>
<li>Cuando muere, el narrador sigue con la familia: la vida <b>continúa sin él</b>, mostrando su indiferencia.</li>
<li><b>Relación con el contexto social:</b> sociedad <b>industrial y capitalista</b> de inicios del siglo XX, burocracia del Imperio austrohúngaro, el trabajador como pieza reemplazable.</li>
</ul>
<div class="callout ok"><b>Enseñanza</b><ul><li>El valor de una persona no depende de lo que produce ni de su apariencia.</li><li>La familia y la sociedad deben responder con empatía ante la enfermedad o la diferencia.</li><li>Es importante no vivir solo para trabajar y cuidar la propia identidad.</li></ul></div>

<h3>Características de la novela presentes</h3>
<ul>
<li>Mayor <b>extensión</b> que un cuento (es una novela corta) y estructura en <b>tres partes</b>.</li>
<li><b>Varios personajes</b> que <b>evolucionan</b> (Grete, el padre).</li>
<li><b>Varios acontecimientos</b> y conflictos: trabajo, economía, familia, huéspedes.</li>
<li><b>Tiempo amplio</b>: transcurren varios meses.</li>
<li>Profundo <b>desarrollo psicológico</b> del protagonista.</li>
<li>Varios <b>espacios</b>: cuarto, sala, apartamento, campo.</li>
</ul>
<div class="callout"><b>Comparación rápida:</b> Asterión y Gregor son seres «monstruosos» ante los ojos de los demás, <b>aislados</b> y rechazados, y ambos terminan en la <b>muerte</b>, que para los otros (o para ellos) es una liberación.</div>
`;

LESSONS.verbo = `
<h2>El verbo</h2>
<div class="callout"><b>Definición:</b> el verbo es la clase de palabra <b>variable</b> que expresa <b>acciones</b> (correr), <b>estados</b> (estar, ser) o <b>procesos</b> (crecer). Es el <b>núcleo del predicado</b> y cambia según persona, número, tiempo y modo.</div>

<h3>Estructura: raíz + desinencias</h3>
<div class="struct" aria-label="cant, a, ba, mos"><span class="r">cant</span><span class="v">a</span><span class="d">ba</span><span class="d">mos</span></div>
<div class="legend"><span><i style="background:var(--verb)"></i>Raíz o lexema: significado</span><span><i style="background:var(--warn)"></i>Vocal temática (conjugación)</span><span><i style="background:var(--write)"></i>Desinencias: tiempo, modo, persona y número</span></div>
<ul>
<li><b>Raíz (lexema):</b> se obtiene quitando <i>-ar, -er, -ir</i> al infinitivo: <i>cant-ar, com-er, part-ir</i>.</li>
<li><b>Desinencias (morfemas flexivos):</b> indican
 <ul><li><b>Persona:</b> 1.ª (yo/nosotros), 2.ª (tú/vosotros), 3.ª (él, ella, usted / ellos, ustedes).</li>
 <li><b>Número:</b> singular o plural.</li>
 <li><b>Tiempo:</b> presente, pasado (pretérito) o futuro.</li>
 <li><b>Modo:</b> la actitud del hablante (indicativo, subjuntivo, imperativo).</li></ul></li>
<li>Tres <b>conjugaciones</b>: 1.ª <i>-ar</i> (amar), 2.ª <i>-er</i> (temer), 3.ª <i>-ir</i> (partir).</li>
</ul>
<p>Ejemplo: <b>com-ía-mos</b> → raíz <i>com-</i>; <i>-ía-</i> = pretérito imperfecto de indicativo; <i>-mos</i> = 1.ª persona plural.</p>

<h3>Los modos</h3>
<div class="tbl-wrap"><table>
<tr><th>Modo</th><th>Expresa</th><th>Ejemplo</th></tr>
<tr><td><b>Indicativo</b></td><td>Hechos <b>reales</b>, objetivos, seguros.</td><td>Gregor <b>despertó</b> transformado.</td></tr>
<tr><td><b>Subjuntivo</b></td><td><b>Deseo, duda, posibilidad, hipótesis</b>; suele ir tras <i>que, ojalá, quizá, si</i>.</td><td>Ojalá Asterión <b>encuentre</b> a su redentor.</td></tr>
<tr><td><b>Imperativo</b></td><td><b>Órdenes, ruegos, consejos</b>. Solo tiene formas propias para <b>tú</b> y <b>vosotros</b>; para usted/ustedes y la negación se usa el subjuntivo.</td><td><b>Vuelve</b> a tu cuarto, Gregor.</td></tr>
</table></div>

<h3>Tiempos simples y compuestos</h3>
<p><b>Simples:</b> una sola palabra (<i>cocía</i>). <b>Compuestos:</b> verbo auxiliar <b>haber</b> + <b>participio</b> (<i>había cocido</i>); indican acción terminada.</p>
<div class="tbl-wrap"><table>
<tr><th colspan="2">Indicativo · simples</th><th colspan="2">Indicativo · compuestos</th></tr>
<tr><td>Presente <small class="muted">(presente)</small></td><td>amo</td><td>Pret. perfecto compuesto <small class="muted">(antepresente)</small></td><td>he amado</td></tr>
<tr><td>Pret. perfecto simple <small class="muted">(pretérito / indefinido)</small></td><td>amé</td><td>Pret. anterior <small class="muted">(antepretérito)</small></td><td>hube amado</td></tr>
<tr><td>Pret. imperfecto <small class="muted">(copretérito)</small></td><td>amaba</td><td>Pret. pluscuamperfecto <small class="muted">(antecopretérito)</small></td><td>había amado</td></tr>
<tr><td>Futuro simple <small class="muted">(futuro)</small></td><td>amaré</td><td>Futuro compuesto <small class="muted">(antefuturo)</small></td><td>habré amado</td></tr>
<tr><td>Condicional simple <small class="muted">(pospretérito)</small></td><td>amaría</td><td>Condicional compuesto <small class="muted">(antepospretérito)</small></td><td>habría amado</td></tr>
<tr><th colspan="2">Subjuntivo · simples</th><th colspan="2">Subjuntivo · compuestos</th></tr>
<tr><td>Presente</td><td>ame</td><td>Pret. perfecto compuesto <small class="muted">(antepresente)</small></td><td>haya amado</td></tr>
<tr><td>Pret. imperfecto <small class="muted">(pretérito)</small></td><td>amara / amase</td><td>Pret. pluscuamperfecto <small class="muted">(antepretérito)</small></td><td>hubiera / hubiese amado</td></tr>
<tr><td>Futuro simple <small class="muted">(futuro, casi en desuso)</small></td><td>amare</td><td>Futuro compuesto <small class="muted">(antefuturo)</small></td><td>hubiere amado</td></tr>
<tr><th colspan="2">Imperativo</th><th colspan="2">Formas no personales</th></tr>
<tr><td>Presente</td><td>ama (tú), amad (vosotros)</td><td>Infinitivo · gerundio · participio</td><td>amar · amando · amado</td></tr>
</table></div>
<p class="small muted">Entre paréntesis: nombres de Andrés Bello, que también se usan en Costa Rica.</p>
<div class="callout"><b>¿Cómo identificar el tiempo en un fragmento?</b><ol><li>¿Una palabra o <i>haber</i> + participio? → simple o compuesto.</li><li>¿Hecho real, deseo/duda u orden? → modo.</li><li>Mira la desinencia: <i>-aba/-ía</i> (copretérito), <i>-ré</i> (futuro), <i>-ría</i> (condicional), <i>-ra/-se</i> (pret. imperfecto de subjuntivo).</li><li>En compuestos, el tiempo de <i>haber</i> da el nombre: <i>había</i> → pluscuamperfecto; <i>haya</i> → pret. perfecto de subjuntivo; <i>hubiera</i> → pluscuamperfecto de subjuntivo.</li></ol></div>
<p><a class="btn sm" href="#/tabla">📋 Abrir la tabla de conjugación interactiva</a></p>
`;

LESSONS.conjug = `
<h2>Verbos regulares, irregulares y conjugaciones especiales</h2>
<div class="grid g2">
<div class="callout ok"><b>Verbo regular:</b> su <b>raíz no cambia</b> en ninguna forma y sigue las desinencias del modelo (amar, temer, partir).<br><i>com-o, com-í, com-eré, com-a</i></div>
<div class="callout warn"><b>Verbo irregular:</b> sufre <b>cambios en la raíz</b> (o en las desinencias) respecto al modelo.<br><i>ten-er → teng-o, tuv-e</i></div>
</div>
<p><b>Truco:</b> conjuga el verbo en <b>presente</b>, <b>pretérito perfecto simple</b> y <b>futuro</b> (y en presente de subjuntivo). Si la raíz cambia en alguno, es irregular.</p>
<ul>
<li>Diptongación: <i>o → ue</i> (cocer → <b>cue</b>zo), <i>e → ie</i> (querer → qu<b>ie</b>ro).</li>
<li>Cierre vocálico: <i>e → i</i> (erguir → <b>ir</b>guió, pedir → pido).</li>
<li>Consonante añadida: <i>-g-</i> (asir → as<b>g</b>o, hacer → ha<b>g</b>o).</li>
<li>Cambio total de raíz: <i>hacer → hic-e, hiz-o</i>; <i>ir → fu-i</i>.</li>
</ul>
<div class="callout"><b>Ajuste ortográfico ≠ irregularidad:</b> <i>vencer → venzo</i> cambia c por z solo para conservar el sonido; eso no lo vuelve irregular. En <i>cocer</i>, en cambio, la irregularidad es el diptongo <b>o → ue</b> (<i>cuezo</i>).</div>

<h3>⭐ Los cuatro verbos del examen</h3>
<details class="acc" open><summary>Satisfacer — se conjuga como <i>hacer</i></summary><div>
<div class="tbl-wrap"><table>
<tr><th>Tiempo</th><th>Formas</th></tr>
<tr><td>Presente ind.</td><td>satisfa<b>go</b>, satisfaces, satisface, satisfacemos, satisfacéis, satisfacen</td></tr>
<tr><td>Pret. perfecto simple</td><td>satisf<b>ice</b>, satisf<b>iciste</b>, satisf<b>izo</b>, satisf<b>icimos</b>, satisf<b>icisteis</b>, satisf<b>icieron</b></td></tr>
<tr><td>Pret. imperfecto ind.</td><td>satisfacía, satisfacías, satisfacía…</td></tr>
<tr><td>Futuro</td><td>satisfa<b>ré</b>, satisfarás, satisfará, satisfaremos, satisfaréis, satisfarán</td></tr>
<tr><td>Condicional</td><td>satisfa<b>ría</b>, satisfarías…</td></tr>
<tr><td>Presente subj.</td><td>satisfa<b>ga</b>, satisfagas, satisfaga, satisfagamos, satisfagáis, satisfagan</td></tr>
<tr><td>Pret. imperfecto subj.</td><td>satisf<b>iciera</b> / satisf<b>iciese</b>…</td></tr>

<h3>✏️ Ortografía de las marcas de tiempo</h3>
<div class="tbl-wrap"><table>
<tr><th>Regla</th><th>Ejemplos</th></tr>
<tr><td>El copretérito de verbos en <b>-ar</b> se escribe con <b>b</b>: <i>-aba</i>. También <i>iba</i> (ir).</td><td>cantaba, cantábamos, iba</td></tr>
<tr><td><b>-ía</b> lleva tilde (hiato) en el copretérito de <i>-er/-ir</i> y en el condicional.</td><td>cocía, asía, satisfaría, erguiría</td></tr>
<tr><td>Futuro: tilde en las formas agudas.</td><td>coceré, cocerás, cocerá, coceréis, cocerán (pero <i>coceremos</i>)</td></tr>
<tr><td>Pret. perfecto simple regular: tilde en 1.ª y 3.ª singular. Las irregulares llanas no llevan tilde.</td><td>cocí, coció, irguió · <b>pero</b> satisfice, satisfizo, hizo</td></tr>
<tr><td>1.ª plural del copretérito <i>-ar</i> y del pret. imperfecto de subjuntivo: esdrújulas con tilde.</td><td>cantábamos, cociéramos, asiéramos, irguiéramos</td></tr>
<tr><td>2.ª plural (vosotros): tilde en <i>-áis, -éis, -ís</i>.</td><td>cocéis, asís, satisfagáis</td></tr>
<tr><td><b>Haber</b> siempre con <b>h</b>; <i>ha</i> (verbo) ≠ <i>a</i> (preposición).</td><td>había, hubiera, haya · «ha cocido» / «va a cocer»</td></tr>
<tr><td><b>Hecho</b> (de hacer) ≠ <b>echo</b> (de echar).</td><td>«ha hecho la tarea» · «echó a los huéspedes»</td></tr>
<tr><td>Imperativo de vosotros termina en <b>-d</b>, no en <i>-r</i>.</td><td>coced, asid, erguid, satisfaced</td></tr>
<tr><td><i>-zo</i>/<i>-za</i> en cocer y <i>-izo</i> en satisfizo: con <b>z</b>.</td><td>cuezo, cueza, satisfizo</td></tr>
</table></div>

<h2>¿Qué es un texto crítico?</h2>
<p>Es un texto en el que <b>defiendes una postura</b> (opinión fundamentada) sobre un tema relacionado con la obra leída. No es un resumen: <b>argumentas</b> con ejemplos del texto y con la realidad.</p>
<div class="tbl-wrap"><table>
<tr><th>Parte</th><th>Qué contiene</th><th>Extensión aprox.</th></tr>
<tr><td><b>Introducción</b></td><td>Presenta el tema, menciona la obra y su autor y plantea tu <b>tesis</b> (postura).</td><td>40–50 palabras</td></tr>
<tr><td><b>Desarrollo</b></td><td>Dos o tres <b>argumentos</b> con <b>ejemplos del texto</b> (hechos, personajes, espacios) y relación con la actualidad.</td><td>100–120 palabras</td></tr>
<tr><td><b>Conclusión</b></td><td>Reafirma la tesis, sintetiza y cierra con una reflexión o enseñanza.</td><td>40–50 palabras</td></tr>
</table></div>
<h3>Normas que se evalúan</h3>
<ul>
<li><b>Mayúscula</b> al inicio del texto, después de punto y en nombres propios (Gregor, Kafka, Borges, Asterión, Teseo).</li>
<li><b>Sangría</b> al inicio de cada párrafo (en el examen a mano: ≈ 1 cm).</li>
<li><b>Ortografía</b>: tildes, b/v, c/s/z, g/j, h. Títulos: cuento entre comillas («La casa de Asterión»), novela en cursiva o subrayada a mano (<i>La metamorfosis</i>).</li>
<li><b>Léxico</b> formal y variado: sin muletillas («o sea», «tipo»), sin coloquialismos («mae», «tuanis»), sin repetir palabras.</li>
<li><b>Tiempos verbales</b>: comenta la obra en <b>presente</b> («Kafka muestra», «Gregor se aísla») y mantén la coherencia; usa pasado para hechos biográficos («Kafka nació en 1883»).</li>
<li><b>Conectores</b>: <i>en primer lugar, además, por otra parte, sin embargo, por ejemplo, por lo tanto, en conclusión</i>.</li>
</ul>
`;

 e:'La casa es el laberinto, cuyos elementos se repiten «catorce» (infinitas) veces.',w:{3:'Asterión aclara que no hay lujos ni «el bizarro aparato de los palacios».'}},
{m:'asterion',l:2,t:['ast-esp'],q:'¿Qué revela el juego del «otro Asterión»?',
 o:['Que Asterión tiene un hermano gemelo','Su profunda soledad y necesidad de compañía','Que Teseo se disfraza para engañarlo','Que la casa tiene espejos mágicos'],a:1,
 e:'Asterión inventa a otro como él para no estar solo: es parte del espacio psicológico.'},
{m:'asterion',l:2,t:['ast-esp'],q:'¿Qué elementos forman el espacio económico del cuento?',
 o:['La deuda del padre con un banco','La austeridad de la casa (sin muebles ni lujos) y el tributo que Atenas paga a Creta','El salario de Asterión como guardián','La venta de telas'],a:1,
 e:'La casa no tiene «pompas mujeriles» y los nueve hombres remiten al tributo impuesto por Creta: una relación de poder.',
 w:{0:'Eso se parece a La metamorfosis.',3:'Gregor vende telas, no Asterión.'}},
{m:'asterion',l:2,t:['ast-esp'],q:'¿Qué aspecto pertenece al espacio moral del cuento?',
 o:['Asterión justifica la muerte de los hombres como una forma de «liberarlos de todo mal»','Las galerías tienen catorce patios','Asterión corre por las azoteas','El epígrafe es de Apolodoro'],a:0,
 e:'El texto cuestiona el bien y el mal: para él, matar es liberar. ¿Quién es el verdadero monstruo?'},
{m:'asterion',l:2,t:['ast-esp'],q:'¿Qué elemento del cuento forma parte del espacio religioso?',
 o:['La espera de un redentor y el sacrificio de las víctimas','La falta de muebles','La huida de la plebe','El número de patios'],a:0,
 e:'La idea de un redentor (salvador), el sacrificio ritual y la sugerencia de que él creó las estrellas y el sol son elementos religiosos.'},
{m:'asterion',l:2,t:['ast-ens'],q:'¿Cuál es una enseñanza del cuento?',
 o:['Hay que construir casas más grandes','No debemos juzgar a los demás por su apariencia: la marginación puede destruir a una persona','El más fuerte siempre gana','Es mejor no salir nunca de casa'],a:1,
 e:'El cuento nos pone en el lugar del «monstruo» y nos invita a la empatía y a no marginar a quien es diferente.'},
{m:'asterion',l:2,t:['ast-ctx','borges'],q:'¿Qué relación puede establecerse entre el cuento y su contexto?',
 o:['Se escribió para celebrar una victoria militar','Refleja la angustia existencial de la posguerra y puede leerse junto al aislamiento que vivió Borges hacia 1946-1947','Es una crítica al gobierno de Costa Rica','Narra un hecho histórico real'],a:1,
 e:'Escrito en 1947, tras la Segunda Guerra Mundial; en 1946 Borges fue humillado por el gobierno peronista y dejó su trabajo. El encierro y la soledad dialogan con ese momento.'},
{m:'asterion',l:2,t:['cuento'],q:'¿Cuál característica del cuento se evidencia con más claridad en el cierre del texto?',
 o:['La división en capítulos','El final sorpresivo que cambia la lectura de todo el relato','La gran cantidad de personajes','El desarrollo de tramas secundarias'],a:1,
 e:'La última frase revela quién era el narrador: un final sorpresivo propio del cuento.'},
{m:'asterion',l:2,t:['cuento'],q:'¿Qué conjunto de rasgos del cuento están presentes en «La casa de Asterión»?',
 o:['Extensión amplia, varios conflictos, muchos personajes','Brevedad, un solo hecho central, pocos personajes y unidad de efecto','Estructura en actos, diálogos y acotaciones','Versos, rima y estrofas'],a:1,
 e:'Son las características del cuento presentes en el texto.',w:{2:'Eso corresponde al teatro.',3:'Eso corresponde a la poesía.'}},
{m:'asterion',l:3,t:['ast-lectura','ast-tema'],q:'¿Por qué el final produce un efecto tan fuerte en el lector?',
 o:['Porque aparece un dragón inesperado','Porque revela que el narrador era el Minotauro y que se dejó matar, lo que cambia el sentido de todo lo leído','Porque Asterión escapa del laberinto','Porque Teseo muere'],a:1,
 e:'Releemos todo lo anterior con otros ojos: el «monstruo» era un ser solitario que deseaba morir.'},
{m:'asterion',l:3,t:['mito'],q:'¿Cuál es el cambio más importante que hace Borges al mito?',
 o:['Elimina a Teseo de la historia','Cuenta la historia desde el Minotauro, dándole voz, pensamientos y sentimientos','Hace que Ariadna mate al Minotauro','Traslada la historia a Buenos Aires'],a:1,
 e:'Al darle voz al monstruo, Borges lo humaniza e invierte la visión tradicional del héroe y la bestia.'},
{m:'asterion',l:3,t:['ast-tema','ast-esp'],q:'Asterión desea que su redentor lo lleve «a un lugar con menos galerías y menos puertas». ¿Cómo se interpreta?',
 o:['Quiere mudarse a una casa más pequeña','Desea la muerte como liberación de su soledad y de su encierro infinito','Quiere conocer Atenas','Busca un trabajo nuevo'],a:1,
 e:'El «redentor» es Teseo: Asterión ve la muerte como salida a su existencia solitaria.'},
{m:'asterion',l:3,t:['ast-lectura','elementos'],q:'Asterión dice que no es prisionero, pero nunca abandona la casa. ¿Qué rasgo del narrador muestra esto?',
 o:['Es un narrador poco confiable: su versión contrasta con la realidad (ironía)','Es un narrador omnisciente que lo sabe todo','Es un narrador testigo','Es un narrador objetivo'],a:0,
 e:'El lector debe leer entre líneas: lo que Asterión dice no coincide del todo con lo que vive.'},
{m:'asterion',l:3,t:['ast-lectura'],q:'En el cuento se afirma que los elementos de la casa son «catorce». ¿Qué simboliza ese número?',
 o:['La edad de Asterión','El infinito','Los años que duró el encierro','El número de víctimas'],a:1,
 e:'Borges usa «catorce» con el valor de «infinito»: la casa (el mundo) no tiene fin.'},
{m:'asterion',l:3,t:['borges'],q:'¿Qué relación hay entre la obra general de Borges y este cuento?',
 o:['Borges solo escribía novelas realistas','Aparecen sus temas recurrentes: el laberinto, el infinito, el doble y la identidad','Borges no conocía la mitología griega','Es su única obra fantástica'],a:1,
 e:'La casa infinita y el «otro Asterión» (el doble) son temas típicos de Borges, lector erudito de mitos.'},
{m:'asterion',l:3,t:['ast-esp','ast-tema'],q:'«El minotauro apenas se defendió». ¿Qué conclusión permite esta frase?',
 o:['Asterión era muy débil físicamente','Asterión aceptó la muerte porque veía en Teseo a su redentor','Teseo usó magia','Ariadna ayudó al Minotauro'],a:1,
 e:'Asterión esperaba a su redentor: no lucha porque la muerte es lo que deseaba.'},

/* ---------------- LA METAMORFOSIS ---------------- */
{m:'metamorfosis',l:1,t:['kafka','met-ctx'],q:'¿Quién escribió La metamorfosis y cuándo se publicó?',
 o:['Jorge Luis Borges, 1949','Franz Kafka, 1915','Gabriel García Márquez, 1967','Miguel de Cervantes, 1605'],a:1,
 e:'Franz Kafka la publicó en 1915.'},
{m:'metamorfosis',l:1,t:['met-pers','met-lectura'],q:'¿Cuál era el trabajo de Gregor Samsa?',
 o:['Médico','Viajante de comercio (vendedor de telas)','Profesor de música','Banquero'],a:1,
 e:'Era viajante de comercio: un trabajo agotador que sostenía a toda la familia.',w:{3:'Es el padre quien después trabaja en un banco, como ordenanza.'}},
{m:'metamorfosis',l:1,t:['met-pers'],q:'¿Quién es Grete?',
 o:['La madre de Gregor','La hermana de Gregor, que toca el violín','La asistenta','La esposa del apoderado'],a:1,
 e:'Grete, de 17 años, cuida a Gregor al inicio; él soñaba con enviarla al conservatorio.'},
{m:'metamorfosis',l:1,t:['met-lectura'],q:'¿Qué le lanza el padre a Gregor en la segunda parte?',
 o:['Piedras','Manzanas','Libros','Zapatos'],a:1,e:'Le lanza manzanas; una se le incrusta en la espalda y se pudre, debilitándolo.'},
{m:'metamorfosis',l:1,t:['novela','met-lectura'],q:'¿Cómo está estructurada la obra?',
 o:['En un solo párrafo','En tres partes','En diez capítulos','En actos y escenas'],a:1,e:'La novela se divide en tres partes.'},
{m:'metamorfosis',l:1,t:['kafka'],q:'¿Cuál dato biográfico de Franz Kafka es correcto?',
 o:['Nació en Praga en 1883, en una familia judía de lengua alemana, y murió de tuberculosis en 1924','Nació en Buenos Aires y fue director de una biblioteca','Fue un novelista español del Siglo de Oro','Ganó el Premio Cervantes'],a:0,
 e:'Kafka nació en Praga (Imperio austrohúngaro) y murió de tuberculosis a los 40 años.'},
{m:'metamorfosis',l:1,t:['kafka'],q:'¿Qué relación tenía Kafka con su padre?',
 o:['Muy cercana y cariñosa','Conflictiva: su padre era autoritario y le generaba miedo y culpa (Carta al padre)','Nunca lo conoció','Su padre era escritor y lo impulsó'],a:1,
 e:'En Carta al padre (1919) expresa el temor que le causaba; se refleja en el señor Samsa.'},
{m:'metamorfosis',l:1,t:['kafka'],q:'¿Qué hizo Max Brod con los escritos de Kafka?',
 o:['Los quemó como Kafka pidió','No los quemó y los publicó después de su muerte','Los vendió en secreto','Los tradujo al español en vida de Kafka'],a:1,
 e:'Gracias a Brod conocemos El proceso y El castillo.'},
{m:'metamorfosis',l:1,t:['met-lectura','met-pers'],q:'¿Quiénes se alojan en la casa en la tercera parte?',
 o:['Tres huéspedes','Los abuelos','El apoderado y su esposa','Unos médicos'],a:0,
 e:'La familia alquila una habitación a tres huéspedes para obtener dinero.'},
{m:'metamorfosis',l:1,type:'tf',t:['met-lectura'],q:'Al despertar transformado, lo primero que preocupa a Gregor es su nuevo cuerpo, no su trabajo.',a:false,
 e:'Falso. Le preocupa haber perdido el tren y llegar tarde: muestra lo alienado que estaba por el trabajo.'},
{m:'metamorfosis',l:1,t:['met-lectura','met-pers'],q:'¿Quién encuentra a Gregor muerto?',
 o:['Grete','La asistenta','El padre','El apoderado'],a:1,e:'La asistenta, la anciana que limpiaba y lo llamaba «bicho».'},
{m:'metamorfosis',l:2,t:['met-tema'],q:'¿Cuál es el tema principal de La metamorfosis?',
 o:['La conquista de un amor imposible','La alienación y deshumanización del individuo que vale solo por lo que produce','La vida en el campo','Las aventuras de un insecto'],a:1,
 e:'Cuando Gregor deja de producir dinero, su familia y la sociedad lo rechazan.'},
{m:'metamorfosis',l:2,t:['met-temas2'],q:'¿Cuál NO es un tema secundario de la obra?',
 o:['La soledad e incomunicación','Las relaciones familiares por interés','La autoridad paterna','La conquista militar de un reino'],a:3,e:'No hay guerras en la obra; los demás temas sí aparecen.'},
{m:'metamorfosis',l:2,t:['met-esp'],q:'¿Qué describe el espacio físico principal?',
 o:['El laberinto de Creta','El apartamento familiar, en especial el cuarto de Gregor','Una fábrica de telas','Un barco'],a:1,
 e:'Casi todo ocurre en el apartamento, sobre todo en la habitación de Gregor; al final, la familia va al campo.'},
{m:'metamorfosis',l:2,t:['met-esp'],q:'¿Qué caracteriza el espacio económico?',
 o:['La familia es muy rica y no necesita trabajar','Gregor es el único sostén y paga una deuda del padre; luego la familia debe trabajar y alquilar habitaciones','Gregor hereda una fortuna','El dinero no tiene importancia en la obra'],a:1,
 e:'El dinero define el valor de Gregor dentro de la familia.'},
{m:'metamorfosis',l:2,t:['met-esp'],q:'¿Qué aspecto pertenece al espacio psicológico?',
 o:['La ventana desde la que se ve el hospital','La angustia, la culpa y la soledad de Gregor, y el paso de la compasión al rechazo en su familia','El uniforme del padre','El tranvía'],a:1,e:'Son emociones y estados interiores de los personajes.'},
{m:'metamorfosis',l:2,t:['met-esp'],q:'Tras la muerte de Gregor, el padre dice que pueden «dar gracias a Dios» y los tres se santiguan. ¿Qué espacio refleja y qué muestra?',
 o:['Espacio económico: muestra su riqueza','Espacio religioso: muestra con ironía que agradecen la muerte de su hijo','Espacio físico: describe la iglesia','Espacio psicológico: muestra que están tristes'],a:1,
 e:'Es una referencia religiosa cargada de ironía: la familia siente alivio.'},
{m:'metamorfosis',l:2,t:['met-esp'],q:'¿Qué aspecto pertenece al espacio moral?',
 o:['El egoísmo e hipocresía de la familia frente al sacrificio de Gregor','El color de las paredes','La hora del tren','El violín de Grete como objeto'],a:0,e:'El contraste entre sacrificio e ingratitud es un conflicto moral.'},
{m:'metamorfosis',l:2,t:['met-pers'],q:'¿Cómo evoluciona Grete a lo largo de la obra?',
 o:['Siempre lo odia','Pasa de cuidarlo con compasión a proponer que se libren de «eso»','Se transforma también en insecto','Se va de la casa al inicio'],a:1,
 e:'Al llamarlo «eso», Grete deja de verlo como su hermano: muestra la deshumanización.'},
{m:'metamorfosis',l:2,t:['met-lectura'],q:'¿Cómo termina la novela?',
 o:['Gregor vuelve a ser humano','La familia, aliviada, viaja en tranvía al campo y piensa en buscar marido para Grete','El padre muere','Gregor escapa por la ventana'],a:1,
 e:'La vida familiar se renueva sin Gregor: un final cargado de indiferencia.'},
{m:'metamorfosis',l:2,t:['met-ctx'],q:'¿Con qué contexto social se relaciona la obra?',
 o:['La conquista de América','La sociedad industrial y burocrática de inicios del siglo XX, donde el trabajador es una pieza reemplazable','La Grecia antigua','La Revolución francesa'],a:1,
 e:'Kafka vivió en el Imperio austrohúngaro, en plena modernidad industrial y burocrática.'},
{m:'metamorfosis',l:2,t:['met-ens'],q:'¿Cuál es una enseñanza de La metamorfosis?',
 o:['Hay que trabajar sin descanso','El valor de una persona no depende de lo que produce ni de su apariencia','Los insectos son peligrosos','La familia siempre tiene la razón'],a:1,
 e:'Invita a la empatía ante la enfermedad o la diferencia.'},
{m:'metamorfosis',l:3,t:['met-tema','met-ctx'],q:'¿Qué simboliza la transformación de Gregor en insecto?',
 o:['Un castigo por robar','La condición deshumanizada en la que ya vivía por su trabajo y su familia; la transformación la hace visible','Un sueño sin importancia','Una enfermedad contagiosa'],a:1,
 e:'Gregor ya vivía como una máquina de producir; la metamorfosis revela esa alienación.'},
{m:'metamorfosis',l:3,t:['kafka'],q:'¿Qué relación hay entre la vida de Kafka y la novela?',
 o:['Ninguna, es pura fantasía','Su padre autoritario y su trabajo burocrático se reflejan en el señor Samsa y en el agobio laboral de Gregor','Kafka también vendía telas y se transformó en insecto','Kafka escribió la obra para su hermana Grete'],a:1,
 e:'La figura paterna dominante y el trabajo que detestaba son claves para entender a Gregor.'},
{m:'metamorfosis',l:3,t:['met-esp','met-pers'],q:'Cuando sacan los muebles de su cuarto, Gregor se aferra al cuadro de la dama con pieles. ¿Qué interpretación es más adecuada?',
 o:['Quiere vender el cuadro','Intenta conservar sus recuerdos y su humanidad','Le gusta la pintura moderna','Quiere asustar a su madre'],a:1,
 e:'Los muebles y el cuadro son lo que le queda de su vida humana.'},
{m:'metamorfosis',l:3,t:['met-lectura','elementos'],q:'Tras la muerte de Gregor, el narrador continúa con la familia. ¿Qué efecto produce?',
 o:['Muestra que la vida sigue sin él y resalta la indiferencia familiar','Indica que Gregor revivirá','Es un error del autor','Presenta a un nuevo protagonista heroico'],a:0,
 e:'El foco pasa a la familia, que «renace»: Gregor era una carga para ellos.'},
{m:'metamorfosis',l:3,t:['kafka'],q:'¿Qué significa el adjetivo «kafkiano»?',
 o:['Alegre y optimista','Una situación absurda, angustiosa y sin salida, a menudo burocrática','Relativo a los insectos','Muy breve'],a:1,e:'Se usa para describir situaciones absurdas y opresivas como las de la obra de Kafka.'},
{m:'metamorfosis',l:3,t:['met-tema','ast-tema'],q:'¿Qué tienen en común Gregor y Asterión?',
 o:['Ambos son héroes que triunfan','Ambos son vistos como «monstruos», viven aislados y rechazados, y terminan muriendo','Ambos viven en Creta','Ambos narran en primera persona'],a:1,
 e:'Los dos textos exploran la soledad y el rechazo del diferente.',w:{3:'Solo Asterión narra en primera persona.'}},
{m:'metamorfosis',l:3,t:['met-esp','met-tema'],q:'La manzana que queda incrustada en la espalda de Gregor puede interpretarse como…',
 o:['Un símbolo del pecado y la culpa, y de la violencia paterna que lo va destruyendo','Un regalo de su padre','Un alimento para Gregor','Un detalle sin importancia'],a:0,
 e:'Tiene una lectura religiosa (el fruto del pecado) y muestra el daño que causa el rechazo familiar.'},

/* ---------------- EL VERBO ---------------- */
{m:'verbo',l:1,t:['v-def'],q:'¿Cuál es la mejor definición de verbo?',
 o:['Palabra invariable que une oraciones','Palabra variable que expresa acción, estado o proceso y es núcleo del predicado','Palabra que nombra personas, animales o cosas','Palabra que acompaña al sustantivo para describirlo'],a:1,
 e:'El verbo varía en persona, número, tiempo y modo.',w:{0:'Eso es la conjunción.',2:'Eso es el sustantivo.',3:'Eso es el adjetivo.'}},
{m:'verbo',l:1,type:'in',t:['v-estr'],q:'Escribe la raíz (lexema) del verbo «cantábamos».',a:['cant','cant-'],
 e:'La raíz se obtiene quitando -ar al infinitivo: cant-ar → cant-.'},
{m:'verbo',l:1,t:['v-estr'],q:'¿Qué información aportan las desinencias verbales?',
 o:['Solo el significado del verbo','Persona, número, tiempo y modo','El género masculino o femenino','El sujeto de la oración'],a:1,e:'El significado está en la raíz; las desinencias indican los accidentes gramaticales.'},
{m:'verbo',l:1,t:['v-modos'],q:'¿Cuáles son los modos verbales?',
 o:['Presente, pasado y futuro','Indicativo, subjuntivo e imperativo','Singular y plural','Simple y compuesto'],a:1,e:'Presente/pasado/futuro son tiempos; singular/plural es número.'},
{m:'verbo',l:1,t:['v-modos'],q:'El modo indicativo expresa…',
 o:['hechos reales u objetivos','órdenes','deseos o dudas','solo acciones futuras'],a:0,e:'«Gregor despertó» presenta un hecho como real.'},
{m:'verbo',l:1,t:['v-modos'],q:'El modo subjuntivo expresa…',
 o:['hechos seguros','órdenes directas','deseo, duda, posibilidad o hipótesis','únicamente el pasado'],a:2,e:'«Ojalá encuentre a su redentor» expresa deseo.'},
{m:'verbo',l:1,t:['v-modos'],q:'¿Qué afirmación sobre el imperativo es correcta?',
 o:['Tiene todos los tiempos','Expresa órdenes o ruegos y tiene formas propias solo para tú y vosotros','Expresa duda','Solo se usa en primera persona'],a:1,
 e:'Para usted/ustedes y para las órdenes negativas se usan formas del subjuntivo.'},
{m:'verbo',l:1,t:['v-modos'],q:'Los tiempos compuestos se forman con…',
 o:['ser + gerundio','haber + participio','estar + infinitivo','ir a + infinitivo'],a:1,e:'Ejemplo: había cocido, haya satisfecho.'},
{m:'verbo',l:1,t:['v-modos','v-frag'],q:'¿Cuál de estas formas es un tiempo compuesto?',
 o:['cocían','habían cocido','cocerán','cuecen'],a:1,e:'Haber (habían) + participio (cocido).'},
{m:'verbo',l:1,type:'tf',t:['v-modos'],q:'El modo imperativo tiene un tiempo futuro.',a:false,e:'Falso. El imperativo solo tiene presente.'},
{m:'verbo',l:1,t:['v-estr'],q:'En «erguimos», ¿qué persona y número indica la desinencia?',
 o:['1.ª persona plural','3.ª persona singular','2.ª persona plural','1.ª persona singular'],a:0,e:'-mos indica nosotros (1.ª plural).'},
{m:'verbo',l:2,t:['v-frag','v-modos'],q:'«Gregor había dormido mal toda la noche». ¿En qué tiempo y modo está el verbo?',
 o:['Pretérito perfecto compuesto de indicativo','Pretérito pluscuamperfecto de indicativo (antecopretérito)','Condicional compuesto','Pretérito pluscuamperfecto de subjuntivo'],a:1,
 e:'Había + participio = pluscuamperfecto de indicativo.'},
{m:'verbo',l:2,t:['v-frag','v-modos'],q:'«Ojalá Asterión encuentre a su redentor». ¿En qué tiempo y modo está «encuentre»?',
 o:['Presente de indicativo','Presente de subjuntivo','Pretérito imperfecto de subjuntivo','Imperativo'],a:1,e:'Expresa deseo (ojalá) → subjuntivo; forma presente.'},
{m:'verbo',l:2,t:['v-frag','v-modos'],q:'«Si Grete hubiera sabido la verdad…». ¿Qué tiempo es «hubiera sabido»?',
 o:['Condicional compuesto','Pretérito pluscuamperfecto de subjuntivo','Pretérito anterior','Pretérito perfecto compuesto de subjuntivo'],a:1,e:'Hubiera + participio = pluscuamperfecto de subjuntivo.'},
{m:'verbo',l:2,t:['v-frag','v-modos'],q:'«…habría actuado de otra manera». ¿Qué tiempo es «habría actuado»?',
 o:['Condicional compuesto (antepospretérito)','Futuro compuesto','Pluscuamperfecto de indicativo','Condicional simple'],a:0,e:'Habría + participio = condicional compuesto.'},
{m:'verbo',l:2,t:['v-frag','v-modos'],q:'«Asterión corría por las galerías». ¿Tiempo y modo de «corría»?',
 o:['Pretérito perfecto simple','Pretérito imperfecto de indicativo (copretérito)','Condicional simple','Presente de subjuntivo'],a:1,e:'-ía en un verbo -er indica copretérito; es una acción habitual en el pasado.',w:{2:'El condicional sería «correría».'}},
{m:'verbo',l:2,t:['v-frag','v-modos'],q:'«Gregor se despertó transformado». ¿Tiempo y modo de «despertó»?',
 o:['Pretérito perfecto simple de indicativo','Pretérito imperfecto de indicativo','Presente de indicativo','Pretérito perfecto compuesto'],a:0,e:'Acción terminada en el pasado, en una sola palabra: pretérito (indefinido).'},
{m:'verbo',l:2,t:['v-frag','v-modos'],q:'«He leído el cuento dos veces». ¿Qué tiempo es?',
 o:['Pretérito perfecto compuesto de indicativo (antepresente)','Pluscuamperfecto','Futuro compuesto','Pretérito anterior'],a:0,e:'He + participio.'},

function regular(inf){
  const r = inf.slice(0,-2), c = inf.slice(-2), ar = c==='ar';
  const add = (base, arr) => arr.map(x => base + x);
  const o = {};
  o.ip = add(r, ar ? ['o','as','a','amos','áis','an'] : c==='er' ? ['o','es','e','emos','éis','en'] : ['o','es','e','imos','ís','en']);
  o.ipps = add(r, ar ? ['é','aste','ó','amos','asteis','aron'] : ['í','iste','ió','imos','isteis','ieron']);
  o.ipi = add(r, ar ? ['aba','abas','aba','ábamos','abais','aban'] : ['ía','ías','ía','íamos','íais','ían']);
  o.if = add(inf, ['é','ás','á','emos','éis','án']);
  o.ic = add(inf, ['ía','ías','ía','íamos','íais','ían']);
  o.sp = add(r, ar ? ['e','es','e','emos','éis','en'] : ['a','as','a','amos','áis','an']);
  const ra = ar ? ['ara','aras','ara','áramos','arais','aran'] : ['iera','ieras','iera','iéramos','ierais','ieran'];
  const se = ar ? ['ase','ases','ase','ásemos','aseis','asen'] : ['iese','ieses','iese','iésemos','ieseis','iesen'];
  o.si = ra.map((x,i) => r + x + ' / ' + r + se[i]);
  o.sf = add(r, ar ? ['are','ares','are','áremos','areis','aren'] : ['iere','ieres','iere','iéremos','iereis','ieren']);
  o.imp = ar ? [r+'a', r+'e', r+'ad', r+'en'] : [r+'e', r+'a', r+(c==='er'?'ed':'id'), r+'an'];
  o.part = r + (ar ? 'ado' : 'ido');
  o.ger = r + (ar ? 'ando' : 'iendo');
  return o;
}

const shuffle = a => { a = a.slice(); for (let i=a.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const stripAcc = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').normalize('NFC');
const norm = s => String(s).toLowerCase().replace(/[.,;:!¡?¿«»"“”()]/g,' ').replace(/\s+/g,' ').trim();

function moduleProgress(id){
  if (id === 'oraciones') return Math.round(Object.keys(S.cons).filter(k => S.cons[k]).length / TASKS.length * 100);
  if (id === 'taller'){
    const quiz = S.best.taller || 0;

    return Math.round((quiz + essay) / 2);
  }
  if (id === 'simulacro') return S.sim.best || 0;
  return S.best[id] || 0;
}
