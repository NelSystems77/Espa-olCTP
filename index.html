function correctText(q){
  if (q.type === 'tf') return q.a ? 'Verdadero' : 'Falso';
  if (q.type === 'in') return q.a[0];
  if (q.type === 'tap') return tapTokens(q.frag).filter(t => t.ans).map(t => t.w).join(', ');
  return q.o[q.a];
}
function tapTokens(frag){
  return frag.split(' ').map(tok => {
    const m = tok.match(/^([^*]*)\*([^*]+)\*(.*)$/);
    return m ? {pre:m[1], w:m[2], post:m[3], ans:true} : (() => { const mm = tok.match(/^([—¡¿«"(]*)(.*?)([.,;:!?»")—]*)$/); return {pre:mm[1], w:mm[2], post:mm[3], ans:false}; })();
  });
}
/**
 * items: preguntas · opts: {defer:bool, title, onFinish(results)}
 */
function runQuiz(root, items, opts = {}){
  let i = 0; const results = [];
  const total = items.length;
  function renderQ(){
    const q = items[i];
    const pct = Math.round(i/total*100);
    root.innerHTML = `
      <div class="qprog"><span>Pregunta ${i+1} de ${total}</span><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Avance"><i style="width:${pct}%"></i></div></div>
      <div class="card" id="qcard">
        <div class="qhead"><span class="lvl lvl-${q.l}">Nivel ${q.l} · ${LEVELS[q.l]}</span>${opts.showMod ? `<span class="small muted">${esc(modById(q.m).title)}</span>` : ''}</div>
        <h2 class="qtext" id="qt" tabindex="-1">${esc(q.q)}</h2>
        <div id="qbody"></div>
        <div id="qfb" aria-live="polite"></div>
        <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn primary" id="qnext" hidden>${i+1 < total ? 'Siguiente →' : 'Ver resultados'}</button></div>
      </div>`;
    const body = $('#qbody', root);
    let answered = false;
    const finish = (ok, given, extra) => {
      if (answered) return; answered = true;
      results.push({q, ok, given});
      if (opts.defer){
        $('#qfb', root).innerHTML = `<div class="fb"><p>Respuesta registrada. Verás la retroalimentación al final.</p></div>`;
      } else {
        const why = extra || '';
        $('#qfb', root).innerHTML = ok
          ? `<div class="fb ok"><h4>✅ ¡Correcto!</h4><p>${esc(q.e)}</p></div>`
          : `<div class="fb ${extra === 'almost' ? 'almost' : 'ko'}"><h4>${extra === 'almost' ? '⚠️ Casi: revisa la tilde' : '❌ Aún no'}</h4>${why && why!=='almost' ? `<p>${esc(why)}</p>` : ''}<p><b>Respuesta correcta:</b> ${esc(correctText(q))}</p><p>${esc(q.e)}</p></div>`;
        announce(ok ? 'Correcto' : 'Incorrecto. La respuesta correcta es ' + correctText(q));
      }
      const nx = $('#qnext', root); nx.hidden = false; nx.focus();
    };
    $('#qnext', root).onclick = () => { i++; if (i < total) renderQ(); else done(); };

    if (!q.type || q.type === 'mc' || q.type === 'tf'){
      const choices = q.type === 'tf' ? [{t:'Verdadero', k:true},{t:'Falso', k:false}] : shuffle(q.o.map((t,k) => ({t,k})));
      body.innerHTML = `<ul class="opts" role="list">${choices.map((c,n) => `<li><button class="opt" data-n="${n}"><span class="k">${'ABCD'[n]}</span><span>${esc(c.t)}</span></button></li>`).join('')}</ul><p class="kbd-hint">Atajo: teclas A–${'ABCD'[choices.length-1]} o 1–${choices.length}.</p>`;
      const pick = n => {
        if (answered) return;
        const c = choices[n]; const ok = c.k === q.a;
        $$('.opt', body).forEach((b, bn) => {
          b.disabled = true;
          if (!opts.defer){
            if (choices[bn].k === q.a) b.classList.add('correct');
            else if (bn === n) b.classList.add('wrong'); else b.classList.add('dim');
          } else if (bn === n) b.style.borderColor = 'var(--primary-2)';
        });
        finish(ok, c.t, !ok && q.w && q.w[c.k] ? q.w[c.k] : '');
      };
      $$('.opt', body).forEach(b => b.onclick = () => pick(+b.dataset.n));
      keyHandler = e => {
        if (e.target.matches('input,textarea')) return;
        const k = e.key.toLowerCase(); let n = 'abcd'.indexOf(k); if (n < 0) n = '1234'.indexOf(k);
        if (n >= 0 && n < choices.length && !answered){ e.preventDefault(); pick(n); }
      };
    } else if (q.type === 'in'){
      body.innerHTML = `<label class="sr-only" for="qin">Tu respuesta</label>
        <div class="inrow"><input type="text" id="qin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe aquí tu respuesta"><button class="btn primary" id="qchk">Comprobar</button></div>
        <div class="accents" aria-label="Insertar letras con tilde">${['á','é','í','ó','ú','ñ','ü'].map(c => `<button type="button" data-c="${c}">${c}</button>`).join('')}</div>`;
      const inp = $('#qin', body);
      $$('.accents button', body).forEach(b => b.onclick = () => { insertAtCursor(inp, b.dataset.c); });
      const check = () => {
        const v = norm(inp.value); if (!v) { inp.focus(); return; }
        const ans = q.a.map(norm);
        const ok = ans.includes(v);
        const almost = !ok && ans.map(stripAcc).includes(stripAcc(v));
        inp.disabled = true; $('#qchk', body).disabled = true;
        if (!opts.defer) inp.style.borderColor = ok ? 'var(--ok)' : almost ? 'var(--warn)' : 'var(--ko)';
        finish(ok, inp.value, almost ? 'almost' : '');
      };
      $('#qchk', body).onclick = check;
      inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); check(); } };
      setTimeout(() => inp.focus(), 50);
      keyHandler = null;
    } else if (q.type === 'tap'){
      const toks = tapTokens(q.frag);
      body.innerHTML = `<p class="small muted">Toca las palabras para marcarlas y luego pulsa «Comprobar».</p>
        <div class="tapfrag">${toks.map((t,n) => `${esc(t.pre)}<button class="tok" aria-pressed="false" data-n="${n}">${esc(t.w)}</button>${esc(t.post)}`).join(' ')}</div>
        <div class="row" style="margin-top:12px"><button class="btn primary" id="qchk">Comprobar</button></div>`;
      $$('.tok', body).forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'));
      $('#qchk', body).onclick = () => {
        const sel = $$('.tok', body).filter(b => b.getAttribute('aria-pressed') === 'true').map(b => +b.dataset.n);
        const want = toks.map((t,n) => t.ans ? n : -1).filter(n => n >= 0);
        const ok = sel.length === want.length && want.every(n => sel.includes(n));
        $$('.tok', body).forEach(b => {
          const n = +b.dataset.n; b.disabled = true;
          if (!opts.defer){
            if (sel.includes(n) && toks[n].ans) b.classList.add('t-ok');
            else if (sel.includes(n)) b.classList.add('t-ko');
            else if (toks[n].ans) b.classList.add('t-miss');
          }
        });
        $('#qchk', body).disabled = true;
        finish(ok, sel.map(n => toks[n].w).join(', ') || '(ninguna)', ok ? '' : 'Las palabras con borde verde discontinuo eran correctas y no las marcaste; las tachadas no correspondían.');
      };
      keyHandler = null;
    }
    const oldHandler = keyHandler;
    keyHandler = e => {
      if (e.key === 'Enter' && answered && !e.target.matches('button,input,textarea')){ e.preventDefault(); $('#qnext', root).click(); return; }
      if (oldHandler) oldHandler(e);
    };
    $('#qt', root).focus({preventScroll:true});
    root.scrollIntoView({block:'start', behavior:'smooth'});
  }
  function done(){ keyHandler = null; opts.onFinish && opts.onFinish(results); }
  renderQ();
}
function insertAtCursor(el, text){
  const s = el.selectionStart ?? el.value.length, e = el.selectionEnd ?? el.value.length;
  el.value = el.value.slice(0, s) + text + el.value.slice(e);
  el.focus(); el.selectionStart = el.selectionEnd = s + text.length;
  el.dispatchEvent(new Event('input'));
}
function orderByLevel(items){ return [1,2,3].flatMap(l => shuffle(items.filter(q => q.l === l))); }
function resultsHTML(results, {title, retryLabel = 'Repetir práctica'} = {}){
  const ok = results.filter(r => r.ok).length, pct = Math.round(ok / results.length * 100);
  const [cls, lab] = nivel(pct);
  const byL = [1,2,3].map(l => { const rs = results.filter(r => r.q.l === l); return rs.length ? `<div><div class="small muted">Nivel ${l} · ${LEVELS[l]}</div><b>${rs.filter(r => r.ok).length}/${rs.length}</b></div>` : ''; }).join('');
  const wrong = results.filter(r => !r.ok);
  return `<div class="card center">
    <p class="muted" style="margin:0">${esc(title || 'Resultado')}</p>
    <div class="score-big">${pct}<small style="font-size:1.2rem">/100</small></div>
    <p style="margin:10px 0"><span class="badge ${cls}">Nivel de logro: ${lab}</span></p>
    <p class="muted small">${ok} de ${results.length} correctas · Inicial &lt; 60 · Intermedio 60–79 · Avanzado ≥ 80</p>
    <div class="lvlstats">${byL}</div>
    <div class="row" style="justify-content:center"><button class="btn primary" data-act="retry">${retryLabel}</button>${wrong.length ? `<button class="btn" data-act="retry-wrong">Repetir solo las ${wrong.length} falladas</button>` : ''}</div>
  </div>
  ${wrong.length ? `<div class="card"><h2>Repasa tus errores</h2>${wrong.map(r => `<div class="review-item"><p><b>${esc(r.q.q)}</b></p>${r.q.frag ? `<p class="small">${esc(r.q.frag.replace(/\*/g,''))}</p>` : ''}<p class="small">Tu respuesta: <span style="color:var(--ko)">${esc(r.given)}</span><br>Correcta: <span style="color:var(--ok)"><b>${esc(correctText(r.q))}</b></span></p><p class="small muted" style="margin:0">${esc(r.q.e)}</p></div>`).join('')}</div>` : `<div class="card center"><p>🎉 ¡Sin errores! Estás listo para el siguiente paso.</p></div>`}`;
}

function viewTabla(){
  view(`${crumbs(`<a href="#/m/verbo">El verbo</a>`, 'Tabla de conjugación')}
    <div class="t-verb">
    <h1>📋 Tabla de conjugación</h1>
    <div class="card">
      <p>Elige un verbo. En los irregulares se <span class="irr">resaltan</span> las formas que <b>no</b> siguen el modelo regular: ahí está el cambio en la raíz.</p>
      <div class="vsel" role="group" aria-label="Verbo">${['amar','temer','partir','satisfacer','cocer','erguir','asir'].map((v,n) => `<button data-v="${v}" aria-pressed="${n===3}">${v}</button>`).join('')}</div>
      <div class="row"><label class="row small" style="gap:6px;cursor:pointer"><input type="checkbox" id="hide"> 🙈 Modo autoevaluación (oculta las formas; toca para revelar)</label></div>
    </div>
    <div id="vt" style="margin-top:16px"></div></div>`);
  let cur = 'satisfacer';
  const render = () => {
    const c = conjugate(cur), reg = regular(cur), hide = $('#hide').checked;
    const isReg = !IRREG[cur];
    const mark = (a, b) => a !== b ? `<span class="irr">${esc(a)}</span>` : esc(a);
    const cell = (h, sub, rows) => `<div class="cell"><h4>${h}<small>${sub}</small></h4><ol>${rows.map(([p,f]) => `<li><span>${p}</span><b class="f" tabindex="${hide?0:-1}">${f}</b></li>`).join('')}</ol></div>`;
    let html = `<div class="card"><h2 style="margin-bottom:4px">${cur} <span class="pill">${isReg ? 'Regular' : 'Irregular'}</span></h2>
      <p class="small muted">Raíz: <b>${cur.slice(0,-2)}-</b> · Infinitivo: ${cur} · Gerundio: ${mark(c.ger, reg.ger)} · Participio: ${mark(c.part, reg.part)}</p>`;
    if (!isReg) html += `<div class="legend" style="margin-bottom:10px"><span><i style="background:var(--lit)"></i>Forma que cambia respecto al modelo regular (irregularidad o ajuste ortográfico c → z)</span></div>`;
    for (const g of TENSES){
      html += `<h3 style="margin-top:18px">${g.g}</h3><div class="conj">`;
      for (const [k, name, bello] of g.list){
        const rows = PERS.map((p, n) => [p, g.comp ? esc(HABER[k][n] + ' ') + mark(c.part, reg.part) : mark(c[k][n], reg[k][n])]);
        html += cell(name, bello, rows);
      }
      html += `</div>`;
    }
    html += `<h3 style="margin-top:18px">Imperativo · presente</h3><div class="conj">${cell('Afirmativo', 'usted/ustedes toman la forma del subjuntivo', IMP_PERS.map((p,n) => [p, mark(c.imp[n], reg.imp[n])]))}
      <div class="cell"><h4>Recuerda<small>ortografía</small></h4><p class="small" style="margin:0">Vosotros termina en <b>-d</b> (${esc(c.imp[2])}). En negativo se usa el subjuntivo: <i>no ${esc(c.sp[1].split(' / ')[0])}</i>.</p></div></div></div>`;
    const vt = $('#vt'); vt.innerHTML = html;
    if (hide){ $$('.f', vt).forEach(f => { f.style.filter = 'blur(6px)'; f.style.cursor = 'pointer'; const rev = () => f.style.filter = 'none'; f.onclick = rev; f.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); rev(); } }; }); }
  };
  $$('.vsel button').forEach(b => b.onclick = () => { cur = b.dataset.v; $$('.vsel button').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); });
  $('#hide').onchange = render;
  render();
}

/* ---------- Constructor de oraciones ---------- */
function hasForm(sentence, form){
  const clean = ' ' + sentence.toLowerCase().replace(/[^a-záéíóúüñ\s]/g, ' ').replace(/\s+/g, ' ') + ' ';
  return clean.includes(' ' + form.toLowerCase() + ' ');
}
function viewOraciones(){
  const m = modById('oraciones');
  let cur = Math.max(0, TASKS.findIndex((t,n) => !S.cons[n]));
  view(`${crumbs(esc(m.title))}<div class="t-verb">
    <span class="step-label">Paso 6 · Indicador 3</span>
    <h1>🛠️ Constructor de oraciones</h1>
    <div class="card"><p style="margin:0">Construye una oración completa usando el verbo en la <b>persona, modo y tiempo</b> que se piden. Se revisa la forma verbal (con su tilde), la <b>mayúscula</b> inicial, el <b>punto final</b> y que la oración esté completa. Tus oraciones pueden relacionarse con las obras leídas.</p></div>
    <div class="card"><div class="tasks-nav" id="tnav" aria-label="Tareas"></div><div id="task"></div></div></div>`);
  const nav = () => { $('#tnav').innerHTML = TASKS.map((t,n) => `<button class="${S.cons[n] ? 'done' : ''}" aria-current="${n===cur}" aria-label="Tarea ${n+1}${S.cons[n] ? ', completada' : ''}" data-n="${n}">${n+1}</button>`).join('');
    $$('#tnav button').forEach(b => b.onclick = () => { cur = +b.dataset.n; nav(); task(); }); };
  const task = () => {
    const t = TASKS[cur]; let tries = 0;
    $('#task').innerHTML = `
      <h2>Tarea ${cur+1} de ${TASKS.length}</h2>
      <div class="task-spec"><span class="pill">Verbo: ${esc(t.v)}</span><span class="pill">Modo: ${esc(t.mode)}</span><span class="pill">Tiempo: ${esc(t.tense)}</span><span class="pill">Persona: ${esc(t.per)}</span></div>
      <p class="small muted">Idea sugerida: ${esc(t.ctx)}</p>
      <label for="sent" class="sr-only">Tu oración</label>
      <textarea id="sent" rows="2" style="min-height:80px" placeholder="Escribe tu oración aquí…">${esc(S.cons['txt'+cur] || '')}</textarea>
      <div class="accents">${['á','é','í','ó','ú','ñ','¿','¡'].map(c => `<button type="button" data-c="${c}">${c}</button>`).join('')}</div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="chk">Revisar oración</button><button class="btn ghost" id="show">Ver un ejemplo</button><span class="spacer"></span><button class="btn" id="nxt">Siguiente →</button></div>
      <div id="tfb" aria-live="polite"></div>`;
    const ta = $('#sent');
    $$('#task .accents button').forEach(b => b.onclick = () => insertAtCursor(ta, b.dataset.c));
    $('#nxt').onclick = () => { cur = (cur + 1) % TASKS.length; nav(); task(); };
    $('#show').onclick = () => { $('#tfb').innerHTML = `<div class="fb"><h4>Ejemplo modelo</h4><p><b>Forma:</b> ${t.forms.map(esc).join(' / ')}</p><p>${esc(t.ex)}</p></div>`; };
    $('#chk').onclick = () => {
      const s = ta.value.trim(); tries++;
      S.cons['txt'+cur] = s;
      const formOk = t.forms.some(f => hasForm(s, f));
      const formAcc = !formOk && t.forms.some(f => hasForm(stripAcc(s), stripAcc(f)));
      const first = s.replace(/^[¡¿—«"\s]+/, '').charAt(0);
      const capOk = !!first && first === first.toUpperCase() && first !== first.toLowerCase();
      const endOk = /[.!?»"]$/.test(s);
      const wc = words(s).length, lenOk = wc >= 5;
      const items = [
        [formOk, formOk ? `Usaste correctamente la forma «${t.forms.find(f => hasForm(s, f))}».` : formAcc ? 'La forma verbal está casi bien: revisa la tilde o la ortografía.' : `No se encuentra la forma de «${t.v}» en ${t.mode.toLowerCase()}, ${t.tense.toLowerCase()}, ${t.per}.${tries >= 2 ? ' Pista: ' + (t.forms[0].slice(0, Math.ceil(t.forms[0].length/2))) + '…' : ' Revisa la tabla de conjugación.'}`],
        [capOk, capOk ? 'Empieza con mayúscula.' : 'La oración debe empezar con mayúscula.'],
        [endOk, endOk ? 'Tiene signo de cierre.' : 'Falta el punto final (o signo de cierre).'],
        [lenOk, lenOk ? `Oración completa (${wc} palabras).` : 'La oración es muy corta: agrega sujeto y complementos (mínimo 5 palabras).']
      ];
      const all = items.every(i => i[0]);
      if (all){ S.cons[cur] = true; }
      save(); nav();
      $('#tfb').innerHTML = `<div class="fb ${all ? 'ok' : formAcc ? 'almost' : 'ko'}"><h4>${all ? '✅ ¡Oración lograda!' : 'Revisa estos puntos'}</h4>
        <ul class="checks">${items.map(([ok, msg]) => `<li><span class="st ${ok ? 'ok' : 'ko'}">${ok ? '✓' : '!'}</span><span>${esc(msg)}</span></li>`).join('')}
        <li><span class="st warn">?</span><span>Autocontrol: ¿el sujeto concuerda con el verbo y la oración tiene sentido completo?</span></li></ul>
        ${all ? `<p style="margin-top:8px"><b>Otro ejemplo:</b> ${esc(t.ex)}</p>` : ''}</div>`;
      announce(all ? 'Oración lograda' : 'Hay puntos por revisar');
    };
  };
  nav(); task();
}

    const items = orderByLevel(Object.entries(SIM_PLAN).flatMap(([m,n]) => shuffle(Q.filter(q => q.m === m)).slice(0,n)));
    const t0 = Date.now();
    const root = $('#sroot');
    runQuiz(root, items, {defer, showMod:true, onFinish: res => {
      const mins = Math.round((Date.now()-t0)/60000);
      const pct = Math.round(res.filter(r => r.ok).length / res.length * 100);
      S.sim.last = pct; if (pct > (S.sim.best||0)) S.sim.best = pct; save();
      const inds = [1,2,3,4].map(ind => { const rs = res.filter(r => IND_OF[r.q.m] === ind); const p = rs.length ? Math.round(rs.filter(r => r.ok).length / rs.length * 100) : 0; return {ind, p, n:rs.length}; });
      const rec = {1:'#/m/asterion', 2:'#/m/verbo', 3:'#/m/conjug', 4:'#/taller'};
      root.innerHTML = `<div class="card"><h2>Reporte por indicador</h2><p class="small muted">Tiempo: ${mins} min</p>
        ${inds.map(x => { const [c,l] = nivel(x.p); return `<div style="margin:14px 0"><div class="row"><b>Indicador ${x.ind}</b><span class="badge ${c}">${l} · ${x.p}%</span><span class="spacer"></span>${x.p < 80 ? `<a class="small" href="${rec[x.ind]}">Reforzar →</a>` : ''}</div><p class="small muted" style="margin:4px 0 6px">${esc(INDICATORS[x.ind])}</p><div class="bar"><i style="width:${x.p}%;background:var(--${c==='ava'?'ok':c==='int'?'warn':'ko'})"></i></div></div>`; }).join('')}
        <div class="callout"><b>Recuerda:</b> el examen también pide <b>construir oraciones</b> con los verbos indicados y <b>redactar un texto crítico de 200 palabras</b>. Practícalos en el <a href="#/oraciones">Constructor</a> y en el <a href="#/taller">Taller</a>.</div></div>`
        + resultsHTML(res, {title:'Simulacro de examen', retryLabel:'Nuevo simulacro'});
      $('[data-act=retry]', root).onclick = () => viewSimulacro();
      const rw = $('[data-act=retry-wrong]', root);
      if (rw) rw.onclick = () => runQuiz(root, res.filter(r => !r.ok).map(r => r.q), {showMod:true, onFinish: r2 => { root.innerHTML = resultsHTML(r2, {title:'Repaso de errores del simulacro', retryLabel:'Nuevo simulacro'}); $('[data-act=retry]', root).onclick = () => viewSimulacro(); const rw2 = $('[data-act=retry-wrong]', root); if (rw2) rw2.remove(); }});
      window.scrollTo({top:0, behavior:'smooth'});
    }});
  };
}

/* =========================================================
   11. ROUTER Y PREFERENCIAS
   ========================================================= */
function go(h){ location.hash = h; }
function route(){
  const p = location.hash.replace(/^#\/?/, '').split('/');
  if (!p[0]) return viewHome();
  if (p[0] === 'temario') return viewTemario();
  if (p[0] === 'tabla') return viewTabla();
  if (p[0] === 'oraciones') return viewOraciones();
  if (p[0] === 'taller') return viewTaller();
  if (p[0] === 'simulacro') return viewSimulacro();
  if (p[0] === 'm' && p[1]){ const m = modById(p[1]); if (m && m.special) return go(modHref(m)); return p[2] === 'practica' ? viewPractice(p[1]) : viewLesson(p[1]); }
  viewHome();
}
window.addEventListener('hashchange', route);
(function prefs(){
  const th = pref('theme'); if (th) document.documentElement.dataset.theme = th;
  const fs = pref('fs'); if (fs) document.documentElement.dataset.fs = fs;
  $('#btnTheme').onclick = () => {
    const isDark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const nt = isDark ? 'light' : 'dark'; document.documentElement.dataset.theme = nt; pref('theme', nt);
    $('meta[name=theme-color]').content = nt === 'dark' ? '#0F1522' : '#2F4F9A';
  };
  $('#btnFs').onclick = () => { const nf = document.documentElement.dataset.fs === 'lg' ? '' : 'lg'; document.documentElement.dataset.fs = nf; pref('fs', nf); toast(nf ? 'Letra grande activada' : 'Letra normal'); };
})();
route();
</script>
