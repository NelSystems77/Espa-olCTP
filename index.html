<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Craft-Español • Repaso Examen 10°</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#3E7BD6;
  --sky-bot:#8FCBEA;
  --grass:#5D9C39;
  --grass-dark:#3E6B25;
  --dirt:#8B5A2C;
  --dirt-dark:#5C3A1A;
  --stone:#8B8B8B;
  --stone-dark:#5A5A5A;
  --obsidian:#1C1330;
  --obsidian-2:#2E1F52;
  --diamond:#5CE7E1;
  --gold:#FFD54A;
  --emerald:#3ED17A;
  --redstone:#E2453C;
  --panel:#C8A570;
  --panel-dark:#7A5A34;
  --ink:#241a0f;
  --paper:#EFE0BE;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'VT323', monospace;
  font-size:22px;
  color:var(--ink);
  background:linear-gradient(var(--sky-top), var(--sky-bot));
  min-height:100vh;
  image-rendering:pixelated;
  overflow-x:hidden;
}
.pixel-font{ font-family:'Press Start 2P', monospace; }
#clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.cloud{position:absolute;background:#fff;opacity:.85;box-shadow:
  16px 0 0 #fff, -16px 0 0 #fff, 0 12px 0 #fff, 32px 12px 0 #fff, -32px 12px 0 #fff;
  width:24px;height:16px;animation:drift linear infinite;}
@keyframes drift{ from{transform:translateX(-10vw);} to{transform:translateX(110vw);} }

.app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:14px 12px 90px;}

/* Blocky Minecraft panel style */
.slab{
  background:var(--panel);
  border:4px solid var(--panel-dark);
  box-shadow: inset 3px 3px 0 rgba(255,255,255,.35), inset -3px -3px 0 rgba(0,0,0,.35);
  border-radius:2px;
  padding:14px;
  margin-bottom:14px;
}
.slab.dark{ background:#3a2a18; color:#f1e2c0; border-color:#241a0f; }
.title-bar{
  text-align:center;
  padding:14px 8px;
  margin-bottom:16px;
}
.title-bar h1{
  font-size:15px;
  line-height:1.6;
  color:#fff;
  text-shadow: 3px 3px 0 #3E6B25, -1px -1px 0 #24461a;
  margin:0 0 6px;
}
.title-bar p{
  font-size:20px;
  margin:0;
  color:#eaffe0;
  text-shadow:2px 2px 0 #24461a;
}

/* Buttons */
.btn{
  font-family:'Press Start 2P', monospace;
  font-size:11px;
  color:#fff;
  background:var(--grass);
  border:3px solid var(--grass-dark);
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.4), inset -2px -2px 0 rgba(0,0,0,.35);
  padding:12px 10px;
  cursor:pointer;
  width:100%;
  text-align:left;
  display:flex;
  align-items:center;
  gap:10px;
  line-height:1.5;
  transition:transform .05s;
}
.btn:active{ transform:translateY(2px); }
.btn:disabled{ cursor:default; opacity:.55; }
.btn.stone{ background:var(--stone); border-color:var(--stone-dark); }
.btn.obsidian{ background:var(--obsidian-2); border-color:#0d0818; }
.btn.gold{ background:#C9992C; border-color:#7a5a12; }
.btn.wide{ justify-content:center; }
.btn.small{ font-size:10px; padding:8px; width:auto; }
.btn.correct{ background:var(--emerald)!important; border-color:#1c8a4f!important; }
.btn.wrong{ background:var(--redstone)!important; border-color:#8f1f19!important; animation:shake .3s; }
@keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

.icon{ width:26px;height:26px;flex:0 0 auto; image-rendering:pixelated; }

/* World cards */
.world-card{
  display:flex;align-items:center;gap:12px;
  padding:14px;margin-bottom:14px;
  border:4px solid var(--panel-dark);
  cursor:pointer;
  position:relative;
}
.world-card .block{
  width:52px;height:52px;flex:0 0 auto;border:3px solid rgba(0,0,0,.4);
}
.world-card.grass{ background:linear-gradient(180deg,#EFE0BE 0%, #d9e8bd 100%); }
.world-card.grass .block{ background:linear-gradient(var(--grass) 0 60%, var(--dirt) 60% 100%); }
.world-card.obsidian{ background:linear-gradient(180deg,#EFE0BE 0%, #cdbfe3 100%); }
.world-card.obsidian .block{ background:repeating-linear-gradient(45deg, var(--obsidian), var(--obsidian) 6px, var(--obsidian-2) 6px, var(--obsidian-2) 12px); }
.world-card.stone{ background:linear-gradient(180deg,#EFE0BE 0%, #d6d6d6 100%); }
.world-card.stone .block{ background:repeating-linear-gradient(0deg, var(--stone), var(--stone) 8px, var(--stone-dark) 8px, var(--stone-dark) 10px); }
.world-card .info{ flex:1; }
.world-card .info h3{ font-family:'Press Start 2P'; font-size:11px; margin:0 0 6px; }
.world-card .info p{ margin:0; font-size:18px; opacity:.85; }
.progress-track{ background:#00000030; border:2px solid #00000055; height:14px; margin-top:8px; }
.progress-fill{ background:var(--emerald); height:100%; width:0%; transition:width .4s; }

/* Level list */
.level-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.level-row .stars{ font-size:16px; min-width:64px; text-align:right; color:var(--gold); text-shadow:1px 1px 0 #000; }

/* Quiz */
.quiz-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-family:'Press Start 2P'; font-size:10px; color:#fff; text-shadow:2px 2px 0 #000; }
.hearts{ letter-spacing:3px; }
.qtext{ font-size:24px; line-height:1.4; margin:10px 0 16px; }
.options{ display:flex; flex-direction:column; gap:10px; }
.feedback{ margin-top:12px; padding:10px; font-size:19px; border:3px solid; }
.feedback.ok{ background:#e6fff0; border-color:var(--emerald); }
.feedback.no{ background:#ffe9e7; border-color:var(--redstone); }
.nav-row{ display:flex; gap:10px; margin-top:14px; }
.nav-row .btn{ width:auto; flex:1; justify-content:center; }

.hidden{ display:none!important; }

/* Result / rank screen */
.rank-badge{ text-align:center; padding:20px; }
.rank-badge .big{ font-family:'Press Start 2P'; font-size:34px; margin:10px 0; }
.rank-badge .score{ font-family:'Press Start 2P'; font-size:20px; }

/* top nav */
.topnav{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.topnav .btn{ width:auto; }
footer{ text-align:center; font-size:14px; opacity:.6; margin-top:20px; }

@media (min-width:600px){
  body{font-size:24px;}
  .title-bar h1{font-size:19px;}
}
</style>
</head>

<div class="app" id="app"></div>

{

{

/* ============================= ESTADO Y PERSISTENCIA ============================= */
const SAVE_KEY = 'craftEspanolProgress_v1';
function loadProgress(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { levels:{}, examScores:[] };
}
function saveProgress(p){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(p)); }catch(e){}
}
let progress = loadProgress();

function levelKey(worldId, levelId){ return worldId + ':' + levelId; }
function getLevelStars(worldId, levelId){
  const rec = progress.levels[levelKey(worldId, levelId)];
  return rec ? rec.stars : 0;
}
function totalLevelsCount(){
  return WORLDS.reduce((acc,w)=>acc + w.levels.length, 0);
}
function completedLevelsCount(){
  return Object.keys(progress.levels).filter(k=>progress.levels[k].done).length;
}

/* ============================= NAVEGACIÓN / RENDER ============================= */
const app = document.getElementById('app');
let view = { screen:'home' };

function go(screen, params){ view = Object.assign({screen}, params||{}); render(); window.scrollTo(0,0); }

function render(){
  if(view.screen==='home') return renderHome();
  if(view.screen==='world') return renderWorld(view.worldId);
  if(view.screen==='quiz') return renderQuiz(view.worldId, view.levelId, false);
  if(view.screen==='exam-intro') return renderExamIntro();
  if(view.screen==='exam') return renderExam();
  if(view.screen==='result') return renderResult(view.correct, view.total, view.isExam);
}

function iconBlock(kind){
  return `<div class="block" style="background:${kind}"></div>`;
}

function renderHome(){
  const done = completedLevelsCount();
  const tot = totalLevelsCount();
  const pct = Math.round(done/tot*100);
  let html = `
    <div class="title-bar">
      <h1 class="pixel-font">CRAFT-ESPAÑOL</h1>
      <p>Repaso 2° Examen · Español 10° · I Periodo 2026</p>
    </div>
    <div class="slab dark">
      <p class="pixel-font" style="font-size:10px; margin:0 0 8px;">PROGRESO GENERAL</p>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <p style="margin:8px 0 0; font-size:16px;">${done} / ${tot} niveles completados</p>
    </div>
  `;
  WORLDS.forEach(w=>{
    const starsTotal = w.levels.reduce((a,l)=>a + l.questions.length,0);
    const starsGot = w.levels.reduce((a,l)=>a + getLevelStars(w.id,l.id),0);
    html += `
      <div class="world-card ${w.theme}" onclick="go('world',{worldId:'${w.id}'})">
        ${iconBlock('')}
        <div class="info">
          <h3>${w.name}</h3>
          <p>${w.subtitle}</p>
          <div class="progress-track"><div class="progress-fill" style="width:${Math.round(starsGot/starsTotal*100)}%"></div></div>
        </div>
      </div>
    `;
  });
  html += `
    <div class="slab" style="text-align:center;">
      <p class="pixel-font" style="font-size:11px; margin:0 0 10px;">⚔️ BATALLA FINAL ⚔️</p>
      <p style="margin:0 0 12px;">Simulacro mezclado de los 3 mundos. ¡Tu nota va de 0 a 100!</p>
      <button class="btn gold wide" onclick="go('exam-intro')">Iniciar examen final</button>
    </div>
    <div class="slab" style="text-align:center;">
      <button class="btn stone wide small" onclick="resetProgress()">↺ Reiniciar progreso</button>
    </div>
  `;
  app.innerHTML = html;
}

function renderWorld(worldId){
  const w = WORLDS.find(x=>x.id===worldId);
  let html = `
    <div class="topnav">
      <button class="btn stone small" onclick="go('home')">◀ Volver</button>
    </div>
    <div class="title-bar">
      <h1 class="pixel-font" style="font-size:13px;">${w.name}</h1>
      <p>${w.subtitle}</p>
    </div>
  `;
  w.levels.forEach((l,idx)=>{
    const stars = getLevelStars(w.id,l.id);
    const total = l.questions.length;
    html += `
      <div class="level-row">
        <button class="btn ${w.theme==='obsidian'?'obsidian':(w.theme==='stone'?'stone':'')}" style="flex:1;" onclick="go('quiz',{worldId:'${w.id}', levelId:'${l.id}'})">
          📦 Nivel ${idx+1}: ${l.name}
        </button>
        <div class="stars">${stars}/${total}⭐</div>
      </div>
    `;
  });
  app.innerHTML = html;
}

/* ---- Quiz engine (practice mode, retry until correct) ---- */
let quizState = null;

function startQuiz(worldId, levelId){
  const w = WORLDS.find(x=>x.id===worldId);
  const l = w.levels.find(x=>x.id===levelId);
  quizState = {
    worldId, levelId,
    questions: l.questions.map((q,i)=>({...q, idx:i})),
    pos:0,
    correctFirstTry:0,
    triedWrongThisQ:new Set(),
    answeredThisQ:false
  };
}

function renderQuiz(worldId, levelId){
  if(!quizState || quizState.worldId!==worldId || quizState.levelId!==levelId){
    startQuiz(worldId, levelId);
  }
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const w = WORLDS.find(x=>x.id===quizState.worldId);
  const l = w.levels.find(x=>x.id===quizState.levelId);
  const q = quizState.questions[quizState.pos];
  const total = quizState.questions.length;

  let optsHtml = '';
  q.options.forEach((opt,i)=>{
    const wrongTried = quizState.triedWrongThisQ.has(i);
    const isCorrectShown = quizState.answeredThisQ && i===q.correct;
    let cls = 'btn wide';
    if(w.theme==='obsidian') cls += ' obsidian'; else if(w.theme==='stone') cls += ' stone';
    if(isCorrectShown) cls += ' correct';
    else if(wrongTried) cls += ' wrong';
    optsHtml += `<button class="${cls}" ${wrongTried||quizState.answeredThisQ? (isCorrectShown?'':'disabled'):''} onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}) ${opt}</button>`;
  });

  let feedbackHtml = '';
  if(quizState.answeredThisQ){
    feedbackHtml = `<div class="feedback ok">✅ ¡Correcto! ${q.tip}</div>`;
  } else if(quizState.triedWrongThisQ.size>0){
    feedbackHtml = `<div class="feedback no">❌ Intenta de nuevo. Pista: ${q.tip}</div>`;
  }

  const html = `
    <div class="topnav">
      <button class="btn stone small" onclick="go('world',{worldId:'${w.id}'})">◀ Salir del nivel</button>
    </div>
    <div class="quiz-header">
      <span>${l.name}</span>
      <span>${quizState.pos+1} / ${total}</span>
    </div>
    <div class="slab">
      <p class="qtext">${q.q}</p>
      <div class="options">${optsHtml}</div>
      ${feedbackHtml}
      <div class="nav-row">
        ${quizState.answeredThisQ ? `<button class="btn wide" onclick="nextQuizQuestion()">${quizState.pos+1<total?'Siguiente ▶':'Terminar nivel 🏆'}</button>` : ''}
      </div>
    </div>
  `;
  app.innerHTML = html;
}

function answerQuiz(i){
  const q = quizState.questions[quizState.pos];
  if(quizState.answeredThisQ) return;
  if(i===q.correct){
    quizState.answeredThisQ = true;
    if(quizState.triedWrongThisQ.size===0) quizState.correctFirstTry++;
  } else {
    quizState.triedWrongThisQ.add(i);
  }
  renderQuizQuestion();
}

function nextQuizQuestion(){
  quizState.triedWrongThisQ = new Set();
  quizState.answeredThisQ = false;
  quizState.pos++;
  if(quizState.pos>=quizState.questions.length){
    // save progress
    const key = levelKey(quizState.worldId, quizState.levelId);
    progress.levels[key] = { done:true, stars:quizState.correctFirstTry };
    saveProgress(progress);
    go('result', {correct:quizState.correctFirstTry, total:quizState.questions.length, isExam:false, worldId:quizState.worldId});
    quizState = null;
  } else {
    renderQuizQuestion();
  }
}

/* ---- Exam mode (mixed final battle) ---- */
function renderExamIntro(){
  const totalQ = WORLDS.reduce((a,w)=>a + w.levels.reduce((b,l)=>b+l.questions.length,0),0);
  const html = `
    <div class="topnav"><button class="btn stone small" onclick="go('home')">◀ Volver</button></div>
    <div class="slab dark" style="text-align:center;">
      <p class="pixel-font" style="font-size:13px;">⚔️ EXAMEN FINAL ⚔️</p>
      <p style="font-size:19px; margin-top:10px;">30 preguntas mezcladas de los 3 mundos (de un banco de ${totalQ}). Tu resultado se calcula sobre 100, como el examen real.</p>
      <button class="btn gold wide" style="margin-top:14px;" onclick="startExam()">¡Comenzar simulacro!</button>
    </div>
  `;
  app.innerHTML = html;
}

let examState = null;

function startExam(){
  let pool = [];
  WORLDS.forEach(w=> w.levels.forEach(l=> l.questions.forEach(q=> pool.push({...q, worldTheme:w.theme, worldName:w.name}))) );
  // shuffle
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const N = Math.min(30, pool.length);
  examState = { questions: pool.slice(0,N), pos:0, correct:0, answeredThisQ:false, triedWrongThisQ:new Set(), lockedCorrect:true };
  go('exam');
}

function renderExam(){
  const q = examState.questions[examState.pos];
  const total = examState.questions.length;
  let optsHtml = '';
  q.options.forEach((opt,i)=>{
    const wrongTried = examState.triedWrongThisQ.has(i);
    const isCorrectShown = examState.answeredThisQ && i===q.correct;
    let cls = 'btn wide';
    if(q.worldTheme==='obsidian') cls += ' obsidian'; else if(q.worldTheme==='stone') cls += ' stone';
    if(isCorrectShown) cls += ' correct';
    else if(wrongTried) cls += ' wrong';
    optsHtml += `<button class="${cls}" ${wrongTried||examState.answeredThisQ? (isCorrectShown?'':'disabled'):''} onclick="answerExam(${i})">${String.fromCharCode(65+i)}) ${opt}</button>`;
  });
  let feedbackHtml = '';
  if(examState.answeredThisQ){
    feedbackHtml = `<div class="feedback ok">✅ ${q.tip}</div>`;
  } else if(examState.triedWrongThisQ.size>0){
    feedbackHtml = `<div class="feedback no">❌ Otra vez. Pista: ${q.tip}</div>`;
  }
  const html = `
    <div class="quiz-header">
      <span>${q.worldName}</span>
      <span>Pregunta ${examState.pos+1} / ${total}</span>
    </div>
    <div class="slab">
      <p class="qtext">${q.q}</p>
      <div class="options">${optsHtml}</div>
      ${feedbackHtml}
      <div class="nav-row">
        ${examState.answeredThisQ ? `<button class="btn wide" onclick="nextExamQuestion()">${examState.pos+1<total?'Siguiente ▶':'Ver resultado 🏁'}</button>` : ''}
      </div>
    </div>
  `;
  app.innerHTML = html;
}

function answerExam(i){
  const q = examState.questions[examState.pos];
  if(examState.answeredThisQ) return;
  if(i===q.correct){
    examState.answeredThisQ = true;
    if(examState.triedWrongThisQ.size===0) examState.correct++;
  } else {
    examState.triedWrongThisQ.add(i);
  }
  renderExam();
}

function nextExamQuestion(){
  examState.triedWrongThisQ = new Set();
  examState.answeredThisQ = false;
  examState.pos++;
  if(examState.pos>=examState.questions.length){
    const total = examState.questions.length;
    const correct = examState.correct;
    progress.examScores.push({date:new Date().toISOString(), correct, total});
    saveProgress(progress);
    go('result', {correct, total, isExam:true});
    examState = null;
  } else {
    renderExam();
  }
}

/* ---- Result screen ---- */
function renderResult(correct, total, isExam){
  const pct = Math.round(correct/total*100);
  let rank, emoji;
  if(pct>=90){ rank='DIAMANTE'; emoji='💎'; }
  else if(pct>=75){ rank='ESMERALDA'; emoji='🟢'; }
  else if(pct>=60){ rank='ORO'; emoji='🟡'; }
  else if(pct>=40){ rank='HIERRO'; emoji='⚙️'; }
  else { rank='PIEDRA'; emoji='🪨'; }

  const html = `
    <div class="slab dark rank-badge">
      <p class="pixel-font" style="font-size:12px;">${isExam? 'RESULTADO DEL EXAMEN FINAL' : 'NIVEL COMPLETADO'}</p>
      <div class="big">${emoji}</div>
      <p class="score">${pct} / 100</p>
      <p style="font-size:20px; margin-top:6px;">Rango: ${rank}</p>
      <p style="font-size:18px; opacity:.85;">${correct} de ${total} correctas en el primer intento</p>
    </div>
    <div class="slab" style="text-align:center;">
      <button class="btn wide" onclick="go('home')">🏠 Volver al mapa</button>
      ${isExam? `<button class="btn gold wide" style="margin-top:10px;" onclick="startExam()">🔁 Repetir examen final</button>` : ''}
    </div>
  `;
  app.innerHTML = html;
}

function resetProgress(){
  if(confirm('¿Seguro que quieres borrar todo tu progreso guardado?')){
    progress = { levels:{}, examScores:[] };
    saveProgress(progress);
    go('home');
  }
}

/* Nubes de fondo */
(function initClouds(){
  const container = document.getElementById('clouds');
  for(let i=0;i<6;i++){
    const c = document.createElement('div');
    c.className='cloud';
    c.style.top = (10 + Math.random()*50) + '%';
    c.style.left = (Math.random()*100) + '%';
    c.style.animationDuration = (40 + Math.random()*40) + 's';
    c.style.animationDelay = (-Math.random()*40) + 's';
    c.style.transform = 'scale(' + (1+Math.random()*1.5) + ')';
    container.appendChild(c);
  }
})();

render();
</script>
</body>
</html>
